/* ---------- conversa entre usuários: registros compartilhados (só consulta) + mensagens de texto ---------- */
function loadShares(){
  if(!authUser || !authUser.email || !window.__fb) return;
  sharesLoading = true;
  render();
  var email = authUser.email.toLowerCase();
  Promise.all([window.__fb.fetchIncomingShares(email), window.__fb.fetchSentShares(email)])
    .then(function(results){
      incomingShares = results[0];
      sentShares = results[1];
      sharesLoading = false;
      sharesLoaded = true;
      processFriendAddShares(); // adiciona automaticamente quem me convidou por link (se ainda não for meu amigo)
      render();
    })
    .catch(function(){ sharesLoading = false; sharesLoaded = true; render(); });
}
// Processa convites recebidos por link (shares do tipo "friend-add"): se quem me convidou ainda não
// está nos meus contatos, adiciona automaticamente — assim a amizade fica de mão dupla sem esforço extra.
function processFriendAddShares(){
  if(!authUser) return;
  var changed = false;
  incomingShares.forEach(function(s){
    if(s.kind==='friend-add' && s.fromEmail && !getContactName(s.fromEmail)){
      if(!state.contacts) state.contacts = {};
      state.contacts[s.fromEmail] = s.fromName || s.fromEmail;
      changed = true;
    }
  });
  if(changed) persist();
}
function findRecordById(type, id){
  var list = type==='manutencao' ? state.maintenance
    : type==='combustivel' ? state.fuel
    : type==='ocorrencia' ? state.occurrences
    : type==='percurso' ? (state.percursos||[])
    : [];
  return list.filter(function(r){ return r.id===id; })[0] || null;
}

// Carrega o nível/XP dos amigos salvos (mais o próprio usuário) pra montar o ranking.
function loadRanking(){
  if(!authUser || !authUser.email || !window.__fb) return;
  rankingLoading = true;
  render();
  var myEmail = authUser.email.toLowerCase();
  var emails = Object.keys(state.contacts||{}).concat([myEmail]);
  window.__fb.fetchLeaderboardEntries(emails).then(function(entries){
    var byEmail = {};
    entries.forEach(function(e){ if(e && e.email) byEmail[e.email.toLowerCase()] = e; });
    // a própria entrada sempre usa o estado local mais atual, pra não esperar a sincronização com a nuvem
    var myLvl = getLevelInfo((state.gamification && state.gamification.xp) || 0);
    byEmail[myEmail] = { email: myEmail, name: authUser.displayName || authUser.email, xp: myLvl.xpTotal, level: myLvl.level };
    rankingEntries = Object.keys(byEmail).map(function(e){ return byEmail[e]; }).sort(function(a,b){ return (b.xp||0)-(a.xp||0); });
    rankingLoading = false;
    rankingLoaded = true;
    render();
  }).catch(function(){ rankingLoading = false; rankingLoaded = true; render(); });
}

/* ---------- convite por link ---------- */
// Monta um link que já vem com meu e-mail e nome — quem abrir, se estiver logado, pode me adicionar
// como amigo com 1 toque, e eu sou adicionado de volta automaticamente na próxima vez que eu abrir o app.
// Codifica e-mail+nome num token opaco (base64) — o link de convite não expõe o e-mail em texto puro.
function encodeInviteToken(emailLower, name){
  var payload = emailLower + '|' + name;
  return btoa(unescape(encodeURIComponent(payload)));
}
function decodeInviteToken(token){
  try{
    var payload = decodeURIComponent(escape(atob(token)));
    var sep = payload.indexOf('|');
    if(sep===-1) return null;
    return { email: payload.slice(0, sep).trim().toLowerCase(), name: payload.slice(sep+1).trim() };
  }catch(e){ return null; }
}
function buildInviteLink(){
  if(!authUser) return '';
  var base = window.location.origin + window.location.pathname;
  var token = encodeInviteToken(authUser.email.toLowerCase(), authUser.displayName || authUser.email);
  return base + '?c=' + encodeURIComponent(token);
}
function shareInviteLink(){
  if(!authUser) return;
  var link = buildInviteLink();
  var text = 'Me adicione no app';
  if(navigator.share){
    navigator.share({ title:'TanqueCheio', text:text, url:link }).catch(function(){ /* usuário cancelou o compartilhamento — sem problema */ });
    return;
  }
  copyInviteLinkSilently(link);
}
// Copia o link sem nunca exibi-lo em tela (nem num prompt) — só a mensagem "Link copiado!" aparece.
function copyInviteLinkSilently(link){
  function onCopied(){
    inviteLinkCopied = true;
    render();
    setTimeout(function(){ inviteLinkCopied = false; render(); }, 3000);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(onCopied).catch(function(){ copyViaHiddenTextarea(link, onCopied); });
    return;
  }
  copyViaHiddenTextarea(link, onCopied);
}
function copyViaHiddenTextarea(text, onSuccess){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok) onSuccess();
  }catch(e){ /* cópia automática indisponível neste navegador — sem exibir o link cru como alternativa */ }
}
// Verifica se a URL trouxe um convite — chamado logo após o login confirmar.
// Formato atual: ?c=<token mascarado>. Mantém suporte ao formato antigo (?convite=email&nome=Nome)
// pra links já compartilhados antes desta mudança continuarem funcionando.
function checkPendingInvite(){
  try{
    var params = new URLSearchParams(window.location.search);
    var inviteEmail = '', inviteName = '';
    var token = params.get('c');
    if(token){
      var decoded = decodeInviteToken(token);
      if(decoded){ inviteEmail = decoded.email; inviteName = decoded.name; }
    } else {
      inviteEmail = (params.get('convite')||'').trim().toLowerCase();
      inviteName = (params.get('nome')||'').trim();
    }
    if(inviteEmail && inviteEmail.indexOf('@')!==-1 && authUser && authUser.email
       && inviteEmail!==authUser.email.toLowerCase() && !getContactName(inviteEmail)){
      pendingInvite = { email: inviteEmail, name: inviteName || inviteEmail };
    }
    if(window.history && window.history.replaceState){
      window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
    }
  }catch(e){ /* URL inválida ou API indisponível — ignora silenciosamente */ }
}
function acceptPendingInvite(){
  if(!pendingInvite || !authUser) return;
  if(!state.contacts) state.contacts = {};
  state.contacts[pendingInvite.email] = pendingInvite.name;
  persist();
  // avisa a outra pessoa que fui adicionado — o app dela vai me adicionar de volta automaticamente
  window.__fb.createShare({
    kind: 'friend-add',
    fromUid: authUser.uid, fromEmail: authUser.email.toLowerCase(), toEmail: pendingInvite.email,
    fromName: authUser.displayName || authUser.email
  }).catch(function(){ /* falha silenciosa — a amizade já foi salva do meu lado de qualquer forma */ });
  pendingInvite = null;
  render();
}

    'Platina': ['#5eead4','#0d9488'], 'Diamante': ['#7dd3fc','#6366f1'], 'Lendário': ['#a855f7','#f59e0b']
  };
  return map[tierName] || map['Bronze'];
}

function drawAchievementCanvas(){
  var canvas = document.getElementById('achievement-canvas');
  if(!canvas) return;
  var lvl = achievementShareLevel || getLevelInfo((state.gamification && state.gamification.xp) || 0).level;
  var tier = getLevelTier(lvl);
  var badgeTier = BADGE_TIERS.find(function(t){ return t.name===tier.name; }) || BADGE_TIERS[0];
  var colors = tierCanvasColors(tier.name);
  var W = 720, H = 720;
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');
  if(!ctx) return;
  var badgeCx = W/2, badgeCy = 190, badgeR = 130;

  function drawBase(){
    var grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    // brasão: mesmo contorno em engrenagem do app, preenchido com o gradiente da faixa — sem sombra
    var badgeGrad = ctx.createLinearGradient(badgeCx-badgeR, badgeCy-badgeR, badgeCx+badgeR, badgeCy+badgeR);
    badgeGrad.addColorStop(0, colors[0]);
    badgeGrad.addColorStop(1, colors[1]);
    drawGearBadgePath(ctx, badgeCx, badgeCy, badgeR);
    ctx.fillStyle = badgeGrad;
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.font = '700 26px Inter, sans-serif';
    ctx.fillText('NÍVEL', W/2, 372);
    ctx.fillStyle = '#fff';
    ctx.font = '800 104px Inter, sans-serif';
    ctx.fillText(String(lvl), W/2, 478);
    ctx.font = '800 40px Inter, sans-serif';
    ctx.fillText(tier.name.toUpperCase(), W/2, 540);
    ctx.font = '600 25px Inter, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    var vehicle = state.vehicles.find(function(v){ return v.id===state.activeVehicleId; });
    ctx.fillText('🚗 TanqueCheio'+(vehicle ? ' · '+getVehicleLabel(vehicle) : ''), W/2, 660);
  }
  drawBase(); // desenha tudo já com a engrenagem preenchida, pra imagem nunca ficar incompleta
  getBadgeIconImage(badgeTier.key, function(img){
    if(document.getElementById('achievement-canvas') !== canvas) return; // modal foi fechado nesse meio tempo
    var iconR = badgeR * 0.62;
    ctx.save();
    ctx.beginPath();
    ctx.arc(badgeCx, badgeCy, iconR, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(img, badgeCx-iconR, badgeCy-iconR, iconR*2, iconR*2);
    ctx.restore();
  });
}

function conversationCounterpart(share, myEmail){
  return (share.fromEmail===myEmail) ? share.toEmail : share.fromEmail;
}
function buildConversations(){
  if(!authUser || !authUser.email) return [];
  var myEmail = authUser.email.toLowerCase();
  // shares do tipo "friend-add" são só um sinal técnico do convite por link — nunca aparecem na conversa
  var all = incomingShares.concat(sentShares).filter(function(s){ return s.kind!=='friend-add'; });
  var byEmail = {};
  all.forEach(function(s){
    var other = conversationCounterpart(s, myEmail);
    if(!byEmail[other]) byEmail[other] = [];
    byEmail[other].push(s);
  });
  var conversations = Object.keys(byEmail).map(function(email){
    var items = byEmail[email].slice().sort(function(a,b){
      var ta = (a.createdAt && a.createdAt.seconds) || 0;
      var tb = (b.createdAt && b.createdAt.seconds) || 0;
      return ta - tb;
    });
    var last = items[items.length-1];
    return { email:email, items:items, last:last };
  });
  conversations.sort(function(a,b){
    var ta = (a.last.createdAt && a.last.createdAt.seconds) || 0;
    var tb = (b.last.createdAt && b.last.createdAt.seconds) || 0;
    return tb - ta;
  });
  return conversations;
}
function shareTimeLabel(share){
  if(!share.createdAt || !share.createdAt.seconds) return '';
  var d = new Date(share.createdAt.seconds*1000);
  return formatDate(d.toISOString().slice(0,10));
}
function conversationPreview(share){
  if(!share) return '';
  return share.kind==='message' ? share.text : (share.summary||'Registro compartilhado');

/* ---------- rastreamento de percurso por GPS ---------- */
let wakeLock = null; // mantém a tela ligada enquanto há um percurso em andamento
function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(lock){
    wakeLock = lock;
    wakeLock.addEventListener('release', function(){ wakeLock = null; });
  }).catch(function(){ /* navegador recusou (ex: bateria fraca) — segue sem travar a tela */ });
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
}
// o navegador libera o wake lock sozinho quando a aba fica em segundo plano — reconquista ao voltar, se o percurso ainda estiver rodando
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && activeTrip) requestWakeLock();
});
function openOdometerUpdateForm(){
  var lastOdoForForm = state.activeVehicleId ? computeStatsForVehicle(state.activeVehicleId).currentOdo : null;
  formPrefill = { date: new Date().toISOString().slice(0,10), odometer: (lastOdoForForm!=null && lastOdoForForm>0) ? lastOdoForForm : null };
  modal = 'odometer';
  render();
}
function startTrip(){
  tripError = '';
  if(!navigator.geolocation){
    tripError = 'Este navegador não oferece acesso à localização.';
    render();
    return;
  }
  activeTrip = { startTime: Date.now(), startCoords: null, startAddress: null, lastCoords: null, totalKm: 0, watchId: null, tickTimer: null, vehicleId: state.activeVehicleId };
  render();
  navigator.geolocation.getCurrentPosition(function(pos){
    if(!activeTrip) return;
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    activeTrip.startCoords = { lat:lat, lng:lng };
    activeTrip.lastCoords = { lat:lat, lng:lng };
    render();
    reverseGeocode(lat, lng, function(addr){
      if(activeTrip){ activeTrip.startAddress = addr || 'Local de partida não identificado'; render(); }
    });
    beginTripWatch();
  }, function(){
    activeTrip = null;
    tripError = 'Não foi possível obter sua localização. Verifique a permissão de GPS do navegador.';
    render();
  }, { enableHighAccuracy:true, timeout:10000 });
}
function beginTripWatch(){
  if(!activeTrip) return;
  requestWakeLock();
  activeTrip.watchId = navigator.geolocation.watchPosition(function(pos){
    if(!activeTrip) return;
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    var acc = pos.coords.accuracy;
    if(acc!=null && acc>50) return; // fix impreciso demais — ignora pra não somar ruído de GPS
    if(activeTrip.lastCoords){
      var distM = haversineDistanceMeters(activeTrip.lastCoords.lat, activeTrip.lastCoords.lng, lat, lng);
      if(distM>8){ // ignora tremulação de GPS parado (carro estacionado, sinal instável)
        activeTrip.totalKm += distM/1000;
        activeTrip.lastCoords = { lat:lat, lng:lng };
        render();
      }
    } else {
      activeTrip.lastCoords = { lat:lat, lng:lng };
    }
  }, function(){ /* erro pontual de GPS — mantém o percurso, só não atualiza nesse instante */ }, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
  activeTrip.tickTimer = setInterval(function(){ if(state.tab==='percurso' && activeTrip) render(); }, 1000);
}
function finishTrip(){
  if(!activeTrip) return;
  if(activeTrip.watchId!=null) navigator.geolocation.clearWatch(activeTrip.watchId);
  if(activeTrip.tickTimer) clearInterval(activeTrip.tickTimer);
  releaseWakeLock();
  var endCoords = activeTrip.lastCoords;
  var summary = {
    id: uid(), vehicleId: activeTrip.vehicleId, date: new Date().toISOString().slice(0,10),
    startTime: activeTrip.startTime, endTime: Date.now(),
    startAddress: activeTrip.startAddress || 'Local de partida não identificado',
    endAddress: 'Buscando endereço final…',
    km: Math.round(activeTrip.totalKm*10)/10
  };
  activeTrip = null;
  pendingTripSummary = summary;
  render();
  if(endCoords){
    reverseGeocode(endCoords.lat, endCoords.lng, function(addr){
      if(pendingTripSummary===summary){ summary.endAddress = addr || 'Local final não identificado'; render(); }
    });
  } else {
    summary.endAddress = 'Local final não identificado';
    render();
  }
}
function commitTrip(updateOdo){
  if(!pendingTripSummary) return;
  var t = pendingTripSummary;
  if(!state.percursos) state.percursos = [];
  var newTripRecord = { id:t.id, vehicleId:t.vehicleId, date:t.date, startAddress:t.startAddress, endAddress:t.endAddress, km:t.km, startTime:t.startTime, endTime:t.endTime };
  state.percursos.push(newTripRecord);
  evaluateMissionsForRecord(newTripRecord, 'percurso');
  if(updateOdo && t.vehicleId){
    var lastOdo = computeStatsForVehicle(t.vehicleId).currentOdo;
    var newOdo = Math.round((lastOdo||0) + t.km);
    freezeOdoDisplay();
    if(!state.odometerLogs) state.odometerLogs = [];
    state.odometerLogs.push({ id: uid(), vehicleId: t.vehicleId, date: t.date, odometer: newOdo });
    triggerOdoRoll();
  }
  pendingTripSummary = null;
  persist();
}

function fuelLevelLabel(fraction){
  if(fraction <= 0.06) return 'E (vazio)';
  if(fraction >= 0.94) return 'F (cheio)';
  var eighth = Math.round(fraction*8);
  var map = {1:'1/8',2:'1/4',3:'3/8',4:'1/2',5:'5/8',6:'3/4',7:'7/8'};
  return map[eighth] || (Math.round(fraction*100)+'%');
}

function renderGaugeSVG(fraction, divisions){
  divisions = divisions || DEFAULT_GAUGE_DIVISIONS;
  var cx=110, cy=118, r=82;
  var angleDeg = 180 - fraction*180;
  var rad = angleDeg * Math.PI/180;
  var tipX = cx + r*Math.cos(rad);
  var tipY = cy - r*Math.sin(rad);
  function tick(deg, len1, len2){
    var rr = deg*Math.PI/180;
    var x1 = cx + len1*Math.cos(rr), y1 = cy - len1*Math.sin(rr);
    var x2 = cx + len2*Math.cos(rr), y2 = cy - len2*Math.sin(rr);
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--border2)" stroke-width="2"/>';
  }
  var tickDegs = [];
  for(var i=0;i<=divisions;i++){ tickDegs.push(180 - i*(180/divisions)); }
  var ticks = tickDegs.map(function(d){ return tick(d, 68, 78); }).join('');
  return '' +
  '<svg id="fuel-gauge-svg" viewBox="0 0 220 135" style="width:100%; max-width:260px; display:block; margin:0 auto; touch-action:none; cursor:pointer;">' +
    '<path d="M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="var(--border)" stroke-width="16" stroke-linecap="round"/>' +
    ticks +
    '<text x="'+(cx-r-4)+'" y="'+(cy+16)+'" fill="var(--red)" font-size="13" font-weight="700" text-anchor="middle">E</text>' +
    '<text x="'+cx+'" y="'+(cy-r-8)+'" fill="var(--muted)" font-size="11" text-anchor="middle">½</text>' +
    '<text x="'+(cx+r+4)+'" y="'+(cy+16)+'" fill="var(--teal)" font-size="13" font-weight="700" text-anchor="middle">F</text>' +
    '<line id="gauge-needle" x1="'+cx+'" y1="'+cy+'" x2="'+tipX+'" y2="'+tipY+'" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="var(--amber)"/>' +
  '</svg>';
}

function updateMaintenanceInterval(service, value){
  var km = parseKmValue(value);
  if(!state.maintenanceIntervals) state.maintenanceIntervals = {};
  if(km > 0) state.maintenanceIntervals[service] = km;
  else delete state.maintenanceIntervals[service];
  persist();
}

function computeMaintenanceAlerts(vehicleId, currentOdo){
  var intervals = state.maintenanceIntervals || {};
  var alerts = [];
  Object.keys(intervals).forEach(function(service){
    var interval = Number(intervals[service]);
    if(!interval || interval <= 0) return;
    var records = state.maintenance.filter(function(m){ return m.vehicleId===vehicleId && m.description===service && !isNaN(Number(m.odometer)); });
    if(!records.length) return;
    var last = records.reduce(function(latest,r){
      if(!latest) return r;
      if(r.date > latest.date) return r;
      if(r.date === latest.date && Number(r.odometer) > Number(latest.odometer)) return r;
      return latest;
    }, null);
    var lastOdo = Number(last.odometer);
    var nextDueKm = lastOdo + interval;
    var remaining = nextDueKm - Number(currentOdo);
    var threshold = Math.max(200, Math.round(interval * 0.1));
    if(remaining <= threshold){
      alerts.push({
        service: service,
        overdue: remaining <= 0,
        remaining: remaining,
        nextDueKm: nextDueKm
      });
    }
  });
  return alerts.sort(function(a,b){ return a.remaining - b.remaining; });
}

function attachEvents(){
  var app = document.getElementById('app');

  app.querySelectorAll('[data-action]').forEach(function(el){
    var action = el.getAttribute('data-action');
    el.addEventListener('click', function(e){
      if(action==='google-signin'){
        authError = '';
        window.__fb.signIn().catch(function(err){
          authError = 'Não foi possível entrar com o Google. Tente de novo.';
          render();
        });
      }
      else if(action==='sign-out'){
        window.__fb.signOutUser().then(function(){ location.reload(); });
      }
      else if(action==='toggle-tab-sound'){
        state.tabSoundEnabled = (state.tabSoundEnabled===false);
        persist();
      }
      else if(action==='toggle-fuel-gauge'){
        state.fuelGaugeEnabled = (state.fuelGaugeEnabled===false);
        persist();
      }
      else if(action==='start-trip'){ startTrip(); }
      else if(action==='start-trip-prompt'){ awaitingTripStartConfirm = true; render(); }
      else if(action==='confirm-start-trip'){ awaitingTripStartConfirm = false; startTrip(); }

      else if(action==='start-trip-open-odometer'){ awaitingTripStartConfirm = false; openOdometerUpdateForm(); }
      else if(action==='cancel-trip'){
        if(activeTrip){
          if(activeTrip.watchId!=null) navigator.geolocation.clearWatch(activeTrip.watchId);
          if(activeTrip.tickTimer) clearInterval(activeTrip.tickTimer);
          releaseWakeLock();
        }
        activeTrip = null;
        render();
      }
      else if(action==='finish-trip'){ finishTrip(); }
      else if(action==='commit-trip-yes'){ commitTrip(true); }
      else if(action==='commit-trip-no'){ commitTrip(false); }
      else if(action==='del-percurso'){

  var maintCostEl = document.getElementById('f-cost');
  var litersEl = document.getElementById('f-liters');
  var priceEl = document.getElementById('f-priceperliter');

  if(litersEl && priceEl && maintCostEl){
    // fuel form: o usuário preenche 2 dos 3 campos (litros, custo/litro, custo total) — o terceiro é sempre calculado
    // a partir dos 2 campos que o usuário DE FATO editou por último, nessa ordem, não importa qual foi preenchido primeiro
    var fuelTouchOrder = [];
    var recalcFuelValues = function(source){
      var idx = fuelTouchOrder.indexOf(source);
      if(idx!==-1) fuelTouchOrder.splice(idx,1);
      fuelTouchOrder.unshift(source);
      fuelTouchOrder = fuelTouchOrder.slice(0,2);
      if(fuelTouchOrder.length<2) return; // ainda falta o segundo campo pra dar pra calcular o terceiro

      var liters = parseMasked(litersEl.value);
      var price = parseMasked(priceEl.value);
      var total = parseMasked(maintCostEl.value);

      if(fuelTouchOrder.indexOf('liters')===-1){
        // usuário preencheu custo/litro + custo total -> calcula litros
        if(price>0) litersEl.value = toMaskedStr(total/price);
      } else if(fuelTouchOrder.indexOf('price')===-1){
        // usuário preencheu litros + custo total -> calcula custo/litro
        if(liters>0) priceEl.value = toMaskedStr(total/liters);
      } else if(fuelTouchOrder.indexOf('total')===-1){
        // usuário preencheu litros + custo/litro -> calcula custo total
        maintCostEl.value = toMaskedStr(liters*price);
      }
    };
    wireMoneyMask('f-liters', function(){ recalcFuelValues('liters'); });
    wireMoneyMask('f-priceperliter', function(){ recalcFuelValues('price'); });
    wireMoneyMask('f-cost', function(){ recalcFuelValues('total'); });
  } else if(maintCostEl){
    // maintenance form: cost only needs the decimal mask, no cross-calc
    wireMoneyMask('f-cost');
  }

  var serviceSel = document.getElementById('f-service');
  if(serviceSel){
    var toggleCustom = function(){
      document.getElementById('f-custom-wrap').style.display = serviceSel.value==='Outro' ? 'block' : 'none';
      var intervalWrap = document.getElementById('f-interval-wrap');
      if(intervalWrap){
        var isPeriodicoNow = SERVICE_TYPES_PERIODICO.indexOf(serviceSel.value) !== -1;
        intervalWrap.style.display = isPeriodicoNow ? 'block' : 'none';
        if(isPeriodicoNow){
          var intervalInput = document.getElementById('f-interval');
          var v = state.maintenanceIntervals[serviceSel.value];
          intervalInput.value = v!=null ? formatKmInt(v) : '';
        }
      }
    };
    serviceSel.addEventListener('change', toggleCustom);
    toggleCustom();
  }

  var occTypeSel = document.getElementById('f-occtype');
  if(occTypeSel){
    var toggleOccCustom = function(){ document.getElementById('f-occtype-custom-wrap').style.display = occTypeSel.value==='Outro' ? 'block' : 'none'; };
    occTypeSel.addEventListener('change', toggleOccCustom);
    toggleOccCustom();
  }

  var brandSel = document.getElementById('v-brand');
  if(brandSel){
    brandSel.addEventListener('change', function(){
      var isOutra = brandSel.value === OUTRA_MARCA;
      document.getElementById('v-custom-brand-wrap').style.display = isOutra ? 'block' : 'none';
      document.getElementById('v-model-wrap').style.display = isOutra ? 'none' : 'block';
      var tankInput = document.getElementById('v-tank');
      if(!isOutra){
        var models = BRANDS[brandSel.value] || [];
        var opts = models.map(function(m){ return '<option value="'+m+'">'+m+'</option>'; }).join('') + '<option value="'+OUTRO_MODELO+'">'+OUTRO_MODELO+'</option>';
        var modelSelEl = document.getElementById('v-model');
        modelSelEl.innerHTML = opts;
        document.getElementById('v-custom-model-wrap').style.display = 'none';
        if(tankInput) tankInput.value = getDefaultTankCapacity(brandSel.value, modelSelEl.value);
      } else {
        document.getElementById('v-custom-model-wrap').style.display = 'block';
        if(tankInput) tankInput.value = DEFAULT_TANK_CAPACITY;
      }
    });
  }
  var modelSel = document.getElementById('v-model');
  if(modelSel){
    modelSel.addEventListener('change', function(){
      document.getElementById('v-custom-model-wrap').style.display = modelSel.value===OUTRO_MODELO ? 'block' : 'none';
      var tankInput = document.getElementById('v-tank');
      if(tankInput && modelSel.value!==OUTRO_MODELO && brandSel){
        tankInput.value = getDefaultTankCapacity(brandSel.value, modelSel.value);
      }
    });
  }
  if(document.getElementById('v-acqvalue')) wireMoneyMask('v-acqvalue');

  document.querySelectorAll('.km-input').forEach(function(kmEl){ wireKmMask(kmEl); });

  var addressEl = document.getElementById('f-address');
  if(addressEl){
    var locCategory = addressEl.getAttribute('data-category');
    var locSelect = document.getElementById('f-location-select');
    var nameWrap = document.getElementById('f-location-name-wrap');
    var refreshNameVisibility = function(){
      var match = findLocationByAddress(locCategory, addressEl.value);
      if(nameWrap) nameWrap.style.display = (addressEl.value.trim() && !match) ? 'block' : 'none';
      if(locSelect) locSelect.value = match ? match.id : '';
    };
    addressEl.addEventListener('input', refreshNameVisibility);
    if(locSelect){
      locSelect.addEventListener('change', function(){
        if(locSelect.value){
          var loc = findLocationById(locCategory, locSelect.value);
          if(loc) addressEl.value = loc.address;
          refreshNameVisibility();
        } else {
          addressEl.value = '';
          refreshNameVisibility();
          addressEl.focus();
        }
      });
    }
    // carrega a localização atual automaticamente, só quando o campo ainda está vazio (lançamento novo)
    // — recurso indisponível quando o local é marcado só por nome (Simplificado, ou Personalizado com "Somente nome")
    if(!usesSimpleLocation() && !addressEl.value && navigator.geolocation){
      navigator.geolocation.getCurrentPosition(function(pos){
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        if(addressEl.value) return; // o usuário já digitou algo enquanto a localização carregava
        var nearest = findNearestSavedLocation(locCategory, lat, lng);
        if(nearest){
          addressEl.value = nearest.address;
          lastGeoCoords = { lat: nearest.lat, lng: nearest.lng };
          lastGeoAddress = nearest.address;
          refreshNameVisibility();
        } else {
          reverseGeocode(lat, lng, function(addressText){
            if(addressText && !addressEl.value){
              addressEl.value = addressText;
              lastGeoCoords = { lat: lat, lng: lng };
              lastGeoAddress = addressText;
              refreshNameVisibility();
            }
          });
        }
      }, function(){ /* permissão negada ou localização indisponível — segue sem preencher automaticamente */ }, { timeout: 8000 });
    }
  }

  var chatMsgInput = document.getElementById('f-chat-message');
  if(chatMsgInput){
    chatMsgInput.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'){ ev.preventDefault(); sendChatMessage(); }
    });
  }

  var shareContactSel = document.getElementById('f-share-compose-contact');
  var shareEmailInput = document.getElementById('f-share-compose-email');
  var shareNameInput = document.getElementById('f-share-compose-name');
  if(shareContactSel){
    shareContactSel.addEventListener('change', function(){
      if(!shareContactSel.value) return;
      if(shareEmailInput) shareEmailInput.value = shareContactSel.value;
      if(shareNameInput) shareNameInput.value = getContactName(shareContactSel.value);
    });
  }
  if(shareEmailInput && shareNameInput){
    shareEmailInput.addEventListener('blur', function(){
      var savedName = getContactName(shareEmailInput.value);
      if(savedName && !shareNameInput.value.trim()) shareNameInput.value = savedName;
    });
  }

  var importInput = document.getElementById('import-input');
  if(importInput) importInput.addEventListener('change', handleImportFile);

  var photoInput = document.getElementById('v-photo-input');
  if(photoInput) photoInput.addEventListener('change', handlePhotoInputChange);

  var gaugeSvg = document.getElementById('fuel-gauge-svg');
  if(gaugeSvg){
    var activeVehicleForGauge = state.vehicles.find(function(v){return v.id===state.activeVehicleId;});
    var gaugeCapacity = activeVehicleForGauge ? (activeVehicleForGauge.tankCapacity || DEFAULT_TANK_CAPACITY) : DEFAULT_TANK_CAPACITY;
    var cx=110, cy=118, r=82;

    function updateGaugeVisual(fraction){
      fuelGaugeFraction = fraction;
      var angleDeg = 180 - fraction*180;
      var rad = angleDeg * Math.PI/180;
      var tipX = cx + r*Math.cos(rad);
      var tipY = cy - r*Math.sin(rad);
      var needle = document.getElementById('gauge-needle');
      if(needle){ needle.setAttribute('x2', tipX); needle.setAttribute('y2', tipY); }
      var readout = document.getElementById('gauge-readout');
      if(readout){ readout.textContent = fuelLevelLabel(fraction)+' · ~'+Math.round(fraction*gaugeCapacity)+' L de '+gaugeCapacity+' L'; }
    }

    function fractionFromEvent(evt){
      var pt = gaugeSvg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      var ctm = gaugeSvg.getScreenCTM();
      if(!ctm) return null;
      var svgP = pt.matrixTransform(ctm.inverse());
      var dx = svgP.x - cx, dy = cy - svgP.y;
      var angle = Math.atan2(dy, dx) * 180/Math.PI; // -180..180, valid range 0..180 (upper half)
      if(dy < 0){
        angle = dx >= 0 ? 0 : 180; // pointer dragged below the pivot line — clamp to nearest end
      }
      angle = Math.max(0, Math.min(180, angle));
      return 1 - (angle/180);
    }

    var dragging = false;
    gaugeSvg.addEventListener('pointerdown', function(evt){
      dragging = true;
      try{ gaugeSvg.setPointerCapture(evt.pointerId); }catch(e){}
      var fr = fractionFromEvent(evt);
      if(fr!=null) updateGaugeVisual(fr);
    });
    gaugeSvg.addEventListener('pointermove', function(evt){
      if(!dragging) return;
      var fr = fractionFromEvent(evt);
      if(fr!=null) updateGaugeVisual(fr);
    });
    gaugeSvg.addEventListener('pointerup', function(){ dragging = false; });
    gaugeSvg.addEventListener('pointercancel', function(){ dragging = false; });
  }

  if(pendingOdoRollAnimation){
    pendingOdoRollAnimation = false;
    var odoStrips = document.querySelectorAll('.odo-digit-strip');
    odoStrips.forEach(function(strip, idx){
      var endPx = parseFloat(strip.getAttribute('data-target-offset'));
      // salta instantaneamente para o início da tira (mostrando "0"), sem transição
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0px)';
      void strip.offsetHeight; // força o navegador a registrar o estado inicial antes de animar
      setTimeout(function(){
        strip.style.transition = 'transform 1.05s cubic-bezier(.16,.84,.29,1)';
        strip.style.transform = 'translateY('+endPx+'px)';
      }, idx*80); // pequena defasagem por dígito, criando um efeito de rolagem em cascata
    });
  }
}

/* ---------- init ---------- */
var APPMODE_STORAGE_KEY = 'controle-veiculo-appmode';
var CUSTOM_CONFIG_STORAGE_KEY = 'controle-veiculo-custommode';
var ALL_TABS = ['manutencao','abastecimento','ocorrencias','percurso','compartilhamento','missoes','dashboard'];
var SIMPLIFIED_TABS = ['manutencao','abastecimento','compartilhamento','missoes','dashboard'];
var DEFAULT_NEW_USER_TABS = ['manutencao','abastecimento','missoes','dashboard']; // primeiro acesso: conjunto enxuto de abas habilitadas
var appMode = 'completo'; // 'completo' | 'simplificado' | 'personalizado' — controla quais abas aparecem e se o campo de local pede endereço completo ou só um nome
var customTabs = ALL_TABS.slice(); // abas ativas no modo Personalizado
var customLocationMode = 'endereco'; // 'endereco' | 'nome' — forma de marcar o local no modo Personalizado
function activeTabKeys(){
  if(appMode==='simplificado') return SIMPLIFIED_TABS;
  if(appMode==='personalizado') return customTabs.length ? customTabs : ['manutencao'];
  return ALL_TABS;
}
function usesSimpleLocation(){
  return (appMode==='simplificado') || (appMode==='personalizado' && customLocationMode==='nome');
}
function applyAppMode(mode, skipRender){
  appMode = (mode==='simplificado' || mode==='personalizado') ? mode : 'completo';
  try{ localStorage.setItem(APPMODE_STORAGE_KEY, appMode); }catch(e){}
  if(activeTabKeys().indexOf(state.tab)===-1){ state.tab = activeTabKeys()[0]; }
  if(!skipRender) render();
}
function loadAppMode(){
  var saved = null;
  try{ saved = localStorage.getItem(APPMODE_STORAGE_KEY); }catch(e){}
  if(saved==='simplificado' || saved==='personalizado' || saved==='completo'){
    appMode = saved;
    return;
  }
  // nenhuma preferência de modo salva ainda neste aparelho — verifica se é primeiro acesso
  var hasExistingData = false;
  try{ hasExistingData = !!localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(hasExistingData){
    appMode = 'completo'; // usuário que já usava o app antes deste ajuste — mantém tudo habilitado
  } else {
    // primeiro acesso: começa em Personalizado com só Manutenção, Abastecimento, Missões e Dashboard
    appMode = 'personalizado';
    customTabs = DEFAULT_NEW_USER_TABS.slice();
    saveCustomConfig();
    try{ localStorage.setItem(APPMODE_STORAGE_KEY, appMode); }catch(e){}
  }
}
function saveCustomConfig(){
  try{ localStorage.setItem(CUSTOM_CONFIG_STORAGE_KEY, JSON.stringify({ tabs: customTabs, locationMode: customLocationMode })); }catch(e){}
}
function loadCustomConfig(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(CUSTOM_CONFIG_STORAGE_KEY)); }catch(e){}
  var savedTabs = (saved && Array.isArray(saved.tabs)) ? saved.tabs.filter(function(t){ return ALL_TABS.indexOf(t)!==-1; }) : [];
  customTabs = savedTabs.length ? savedTabs : ALL_TABS.slice();
  customLocationMode = (saved && saved.locationMode==='nome') ? 'nome' : 'endereco';
}

var THEME_STORAGE_KEY = 'controle-veiculo-theme';
var THEMES = {
  preto: {
    name: 'Preto (atual)',
    vars: { '--bg':'#111317','--bg2':'#17191d','--panel':'#1a1c20','--panel2':'#1c1e22','--border':'#262931','--border2':'#33363d','--text':'#EDEAE3','--muted':'#8a8f98','--dim':'#6a6f78','--dim2':'#5a5f68','--amber':'#E8A33D','--teal':'#3D7068','--red':'#C1503F','--on-accent':'#14161a','--sans':"'Inter', sans-serif" }
  },
  branco: {
    name: 'Branco',
    vars: { '--bg':'#f7f6f3','--bg2':'#ffffff','--panel':'#ffffff','--panel2':'#f1f0ec','--border':'#e3e1da','--border2':'#d3d0c7','--text':'#202226','--muted':'#6b7078','--dim':'#8a8f97','--dim2':'#9ea3aa','--amber':'#c9791a','--teal':'#2f6f5e','--red':'#b0392c','--on-accent':'#ffffff','--sans':"'Poppins', sans-serif" }
  },
  rosa: {
    name: 'Rosa',
    vars: { '--bg':'#fff2f6','--bg2':'#ffffff','--panel':'#ffe9f0','--panel2':'#ffdce8','--border':'#f6c3d6','--border2':'#eda9c4','--text':'#4a1f2e','--muted':'#96677c','--dim':'#b98a9c','--dim2':'#c9a2b2','--amber':'#d6336c','--teal':'#9c4f7c','--red':'#c0392b','--on-accent':'#ffffff','--sans':"'Quicksand', sans-serif" }
  }
};
var currentTheme = 'preto';
function applyTheme(key, skipRender){
  var theme = THEMES[key] ? key : 'preto';
  currentTheme = theme;
  var vars = THEMES[theme].vars;
  var root = document.documentElement;
  Object.keys(vars).forEach(function(k){ root.style.setProperty(k, vars[k]); });
  try{ localStorage.setItem(THEME_STORAGE_KEY, theme); }catch(e){}
  if(!skipRender) render();
}
function loadTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_STORAGE_KEY); }catch(e){}
  applyTheme(saved || 'preto', true);
}

loadTheme();
loadAppMode();
loadCustomConfig();
load();
render();

function startAuthListening(){
  window.__fb.onAuthChange(function(user){
    authChecked = true;
    authUser = user;
    if(user){ handleSignedIn(user); } else { render(); }
  });
}
if(window.__fb){ startAuthListening(); }
else { window.addEventListener('fb-ready', startAuthListening); }

/* ---------- auto-paste address on return from Google Maps ---------- */
function tryPasteAddressFromClipboard(){
  if(!awaitingAddressPaste) return;
  awaitingAddressPaste = false;
  var addrInput = document.getElementById('f-address');
  if(!addrInput) return;
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(text){
      var trimmed = (text||'').trim();
      var el = document.getElementById('f-address');
      if(trimmed && el){
        el.value = trimmed;
        el.dispatchEvent(new Event('input'));
      }
    }).catch(function(){ /* clipboard indisponível ou sem permissão — usuário cola manualmente */ });
  }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') tryPasteAddressFromClipboard();
});
window.addEventListener('focus', tryPasteAddressFromClipboard);

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* PWA offline indisponível — app continua funcionando normalmente online */ });
  });
}
