<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDBMOaAyRdrHoMc6pRm2B6ahwWJB5fmkPU",
    authDomain: "tc-tanque-cheio.firebaseapp.com",
    projectId: "tc-tanque-cheio",
    storageBucket: "tc-tanque-cheio.firebasestorage.app",
    messagingSenderId: "826480646178",
    appId: "1:826480646178:web:de3449aa955fb8c727527b"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);
  const googleProvider = new GoogleAuthProvider();

  // Ponte pro script principal (não-módulo): tudo que o app precisa do Firebase fica pendurado aqui.
  window.__fb = {
    signIn: function(){ return signInWithPopup(fbAuth, googleProvider); },
    signOutUser: function(){ return signOut(fbAuth); },
    onAuthChange: function(callback){ onAuthStateChanged(fbAuth, callback); },
    saveToCloud: function(uid, data){ return setDoc(doc(fbDb, 'users', uid), data); },
    loadFromCloud: function(uid){
      return getDoc(doc(fbDb, 'users', uid)).then(function(snap){
        return snap.exists() ? snap.data() : null;
      });
    },
    createShare: function(shareData){
      var payload = Object.assign({}, shareData, { createdAt: serverTimestamp() });
      return addDoc(collection(fbDb, 'shares'), payload);
    },
    fetchIncomingShares: function(email){
      var q = query(collection(fbDb, 'shares'), where('toEmail', '==', email));
      return getDocs(q).then(function(snap){
        var out = [];
        snap.forEach(function(d){ out.push(Object.assign({ id: d.id }, d.data())); });
        return out;
      });
    },
    fetchSentShares: function(email){
      var q = query(collection(fbDb, 'shares'), where('fromEmail', '==', email));
      return getDocs(q).then(function(snap){
        var out = [];
        snap.forEach(function(d){ out.push(Object.assign({ id: d.id }, d.data())); });
        return out;
      });
    },
    reactToShare: function(shareId, reaction){
      return updateDoc(doc(fbDb, 'shares', shareId), { reaction: reaction });
    },
    saveLeaderboardEntry: function(uid, data){
      return setDoc(doc(fbDb, 'leaderboard', uid), data, { merge: true });
    },
    fetchLeaderboardEntries: function(emails){
      // o Firestore só aceita até 10 valores por consulta "in" — quebra a lista de e-mails em blocos de 10
      var unique = (emails||[]).filter(function(e,i,arr){ return e && arr.indexOf(e)===i; });
      var chunks = [];
      for(var i=0;i<unique.length;i+=10){ chunks.push(unique.slice(i,i+10)); }
      if(!chunks.length) return Promise.resolve([]);
      return Promise.all(chunks.map(function(chunk){
        var q = query(collection(fbDb, 'leaderboard'), where('email', 'in', chunk));
        return getDocs(q).then(function(snap){
          var out = [];
          snap.forEach(function(d){ out.push(d.data()); });
          return out;
        });
      })).then(function(results){ return results.reduce(function(a,b){ return a.concat(b); }, []); });
    }
  };
  window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
  :root{
    --bg:#111317; --bg2:#17191d; --panel:#1a1c20; --panel2:#1c1e22;
    --border:#262931; --border2:#33363d; --text:#EDEAE3; --muted:#8a8f98;
    --dim:#6a6f78; --dim2:#5a5f68; --amber:#E8A33D; --teal:#3D7068; --red:#C1503F;
    --on-accent:#14161a; --sans:'Inter', sans-serif;
    --mono:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg2); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3{ font-family:var(--sans); }
  button, input, select, textarea{ font-family:inherit; }
  #app{
    max-width:520px; margin:0 auto; min-height:100vh; position:relative;
    background:var(--bg); box-shadow:0 0 60px rgba(0,0,0,.35);
    overflow-x:hidden; padding-bottom:8px;
  }

  /* ---------- header ---------- */
  .header{ padding:18px 18px 16px; background:var(--bg2); border-bottom:1px solid var(--border); }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .header-id{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
  .vehicle-photo, .vehicle-photo-placeholder{
    width:88px; height:88px; border-radius:18px; object-fit:cover; flex-shrink:0;
    background:var(--panel2); border:1px solid var(--border2);
    display:flex; align-items:center; justify-content:center;
  }
  .header-id .txt{ min-width:0; }
  .header-id h1{ margin:0; font-size:16.5px; font-weight:700; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .header-id p{ margin:2px 0 0; font-size:11.5px; color:var(--muted); }
  .header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .header-top-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .saving-tag{ font-size:11px; color:var(--dim); font-style:italic; }
  .btn-ghost{
    background:transparent; border:1px solid var(--border2); color:var(--text);
    padding:7px 11px; border-radius:999px; font-size:11.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
  }
  .btn-ghost:hover{ border-color:var(--dim2); }
  .icon-btn{
    width:32px; height:32px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--border); color:var(--muted); display:flex;
    align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{ color:var(--text); }
  .header-actions-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .header-actions-row .btn-ghost{ flex:none; padding:5px 10px; font-size:10.5px; }
  .odo-usage-row{ display:flex; gap:10px; margin-top:16px; align-items:stretch; }
  .odo-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; flex:1; min-width:0; }
  .trip-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px 16px; text-align:center; }
  .trip-live-label{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); font-weight:700; margin-bottom:10px; }
  .trip-km{ font-family:var(--mono); font-size:32px; font-weight:800; }
  .trip-timer{ font-family:var(--mono); font-size:14px; color:var(--dim); margin-top:4px; }
  .trip-row{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; color:var(--muted); margin-top:10px; text-align:left; }
  .usage-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; flex:1; min-width:0; }
  .odo-divider{ height:1px; background:var(--border); margin:12px 0; }
  .odo-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:5px; font-weight:600; }
  .odo-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .odo-card-head .odo-label{ margin-bottom:0; }
  .odo-update-btn{
    display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--teal);
    font-size:10.5px; font-weight:700; padding:2px 0; cursor:pointer; flex-shrink:0;
  }
  .odo-update-btn:active{ opacity:.7; }
  .odo-digits{ font-family:var(--mono); font-size:21px; font-weight:700; display:inline-flex; align-items:baseline; gap:2px; }
  .odo-digit{ background:var(--panel2); border:1px solid var(--border2); border-radius:4px; width:16px; height:24px; text-align:center; overflow:hidden; position:relative; }
  .odo-digit-strip{ display:block; }
  .odo-digit-row{ display:block; height:24px; line-height:24px; }
  .odo-suffix{ font-size:10.5px; color:var(--dim); margin-left:6px; font-weight:500; font-family:var(--sans); }
  .consumo-val{ font-size:17px; font-weight:700; margin-top:5px; }
  .consumo-sub{ font-size:11px; color:var(--dim); margin-top:3px; }

  .maint-alert-banner{ display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .maint-alert-item{ display:flex; align-items:center; gap:9px; background:var(--panel2); border:1px solid var(--border2); border-left:3px solid var(--amber); border-radius:10px; padding:9px 11px; }
  .maint-alert-item.overdue{ border-left-color:var(--red); }
  .maint-alert-txt{ display:flex; flex-direction:column; font-size:12px; line-height:1.4; }
  .maint-alert-txt strong{ font-size:12.5px; color:var(--text); }
  .maint-alert-txt span{ color:var(--muted); font-size:11px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px; min-width:0; }
  .stat-head{ display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-val{ font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .resumo-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 15px; margin-top:16px; }
  .resumo-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .resumo-card-head h3{ margin:0; font-size:12.5px; font-weight:800; display:flex; align-items:baseline; gap:5px; }
  .resumo-card-head .month{ color:var(--dim); font-weight:600; font-size:11px; }
  .resumo-link{ display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--dim); font-size:10.5px; font-weight:700; padding:0; cursor:pointer; }
  .resumo-link:hover{ color:var(--text); }
  .resumo-card .stat-grid{ margin-top:0; }
  .resumo-card .stat-card{ background:var(--panel2); }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:4px; padding:8px; background:var(--bg2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; padding:11px 4px; border-radius:8px; background:transparent; border:none; color:var(--dim); cursor:pointer; }
  .tab-title{ font-size:16px; font-weight:800; margin:14px 4px 8px; }
  .tab-btn .tab-label{ overflow:hidden; text-overflow:ellipsis; }
  .tab-btn.active{ background:var(--panel); color:var(--text); }

  /* ---------- content ---------- */
  .content{ padding:16px 16px 90px; }

  .empty{ text-align:center; padding:48px 20px; color:var(--muted); }
  .empty-icon{ display:flex; justify-content:center; margin-bottom:10px; opacity:.6; }
  .empty-title{ font-size:14px; font-weight:600; color:var(--text); margin:0 0 4px; }
  .empty-sub{ font-size:12.5px; color:var(--dim); margin:0; line-height:1.5; }
  .err-msg{ color:var(--red); font-size:12px; margin-top:12px; }

  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .card-main{ flex:1; min-width:0; }
  .card-title{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .card-meta{ display:flex; gap:12px; margin-top:6px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  .card-meta span{ display:inline-flex; align-items:center; gap:4px; }
  .card-notes{ font-size:12px; color:var(--dim); margin:6px 0 0; line-height:1.45; }
  .card-side{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
  .card-cost{ font-weight:700; font-size:14px; white-space:nowrap; }
  .card-del{ background:transparent; border:none; color:var(--dim); cursor:pointer; padding:2px; display:flex; }
  .chat-thread{ display:flex; flex-direction:column; gap:10px; }
  .chat-bubble{ position:relative; max-width:82%; border-radius:14px; padding:10px 12px; background:var(--panel); border:1px solid var(--border); }
  .chat-bubble.theirs{ align-self:flex-start; border-bottom-left-radius:4px; }
  .chat-bubble.mine{ align-self:flex-end; background:var(--panel2); border-color:var(--border2); border-bottom-right-radius:4px; }
  .chat-bubble-head{ display:flex; align-items:center; gap:6px; font-size:12.5px; }
  .chat-bubble-sub{ font-size:11px; color:var(--dim); margin-top:2px; }
  .chat-bubble-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; font-size:10.5px; color:var(--dim); }
  .bubble-react-btn{ background:transparent; border:none; color:var(--dim); cursor:pointer; padding:1px 4px; display:inline-flex; align-items:center; font-size:12px; font-weight:700; line-height:1; opacity:.6; }
  .bubble-reaction-badge{ position:absolute; bottom:-10px; font-size:13px; background:var(--bg2); border:1px solid var(--border2); border-radius:999px; padding:1px 6px; line-height:1.5; }
  .chat-bubble.mine .bubble-reaction-badge{ right:6px; }
  .chat-bubble.theirs .bubble-reaction-badge{ left:6px; }
  .reaction-picker{ display:flex; gap:6px; margin-top:8px; }
  .reaction-picker button{ background:var(--panel2); border:1px solid var(--border2); border-radius:999px; width:29px; height:29px; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .chat-composer{
    display:flex; align-items:center; gap:8px;
    position:fixed; left:50%; bottom:0; transform:translateX(-50%);
    width:100%; max-width:520px; box-sizing:border-box;
    margin:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg2); border-top:1px solid var(--border); z-index:15;
  }
  .chat-composer input{ flex:1; background:var(--panel); border:1px solid var(--border2); border-radius:999px; padding:11px 16px; color:var(--text); font-size:13.5px; }
  .chat-composer .icon-btn{ flex:none; width:40px; height:40px; border-radius:999px; background:var(--amber); color:var(--on-accent); }
  .chat-thread{ padding-bottom:76px; }
  .card-del:hover{ color:var(--red); }

  /* ---------- gamificação ---------- */
  .level-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
  .level-top{ display:flex; align-items:center; gap:12px; }
  .level-badge{ width:40px; height:40px; border-radius:999px; background:var(--amber); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .level-title{ font-size:15px; font-weight:700; }
  .level-sub{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:4px; margin-top:2px; }
  .level-bar{ margin-top:12px; height:8px; border-radius:999px; background:var(--panel2); border:1px solid var(--border2); overflow:hidden; }
  .level-bar-fill{ height:100%; background:var(--amber); border-radius:999px; transition:width .3s ease; }
  .level-bar-label{ font-size:11px; color:var(--dim); margin-top:6px; text-align:right; }
  .level-tier-tag{ display:inline-block; margin-left:6px; padding:2px 9px; border-radius:999px; font-size:10px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35); vertical-align:middle; }
  /* ---------- brasões (engrenagem) ---------- */
  .gear-badge{ position:relative; flex-shrink:0; }
  .gear-badge .lvl-tag{ position:absolute; bottom:1px; right:1px; background:var(--bg); border:2px solid var(--bg2);
    border-radius:999px; font-size:9px; font-weight:800; padding:1px 5px; color:var(--text); }
  .gear-badge.locked{ filter:grayscale(1) opacity(.5); }
  .gear-badge .lock-tag{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .badges-gallery-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .badge-tier-card{ background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; }
  .badge-tier-card.current{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber); }
  .badge-tier-name{ font-size:12.5px; font-weight:800; }
  .badge-tier-range{ font-size:10px; color:var(--dim); }
  .badge-tier-status{ font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; margin-top:2px; }
  .badge-tier-status.done{ background:rgba(61,112,104,.25); color:#8fd6c8; }
  .badge-tier-status.current{ background:rgba(232,163,61,.22); color:var(--amber); }
  .badge-tier-status.locked{ background:var(--panel2); color:var(--dim); }
  .mission-list{ display:flex; flex-direction:column; gap:10px; }
  .mission-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:11px 13px; display:flex; align-items:center; gap:11px; }
  .mission-card.done{ border-color:var(--teal); }
  .mission-icon{ width:34px; height:34px; border-radius:9px; background:var(--panel2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mission-icon.done{ background:var(--teal); }
  .mission-body{ flex:1; min-width:0; }
  .mission-title{ font-size:13.5px; font-weight:600; }
  .mission-desc{ font-size:11.5px; color:var(--dim); margin-top:2px; line-height:1.4; }
  .mission-xp{ font-size:11.5px; font-weight:700; color:var(--amber); white-space:nowrap; flex-shrink:0; }
  .mission-xp.done{ display:flex; align-items:center; }

  /* ---------- ranking entre amigos ---------- */
  .ranking-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn2{ flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:9px 6px; border-radius:9px; background:var(--panel2); border:1px solid var(--border2); color:var(--dim); font-size:12px; font-weight:600; cursor:pointer; }
  .tab-btn2.active{ background:var(--amber); color:var(--on-accent); border-color:var(--amber); }
  .rank-row{ display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:11px 13px; }
  .rank-row.me{ border-color:var(--amber); }
  .rank-pos{ width:20px; text-align:center; font-size:12.5px; font-weight:800; color:var(--dim); flex-shrink:0; }
  .rank-badge{ width:32px; height:32px; border-radius:999px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-size:12px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .rank-body{ flex:1; min-width:0; }
  .rank-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-tier{ font-size:11px; color:var(--dim); margin-top:1px; }
  .rank-xp{ font-size:11.5px; font-weight:700; color:var(--amber); white-space:nowrap; flex-shrink:0; }

  .fab{
    position:fixed; right:calc(50% - 260px + 20px); bottom:22px; width:56px; height:56px;
    border-radius:999px; border:none; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,.4); cursor:pointer; z-index:20;
  }
  @media (max-width:559px){ .fab{ right:20px; } }

  /* ---------- overlay / sheet ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.center{ align-items:center; padding:20px; }
  .sheet{
    background:var(--bg2); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:20px 18px 28px; animation:slideUp .22s ease-out;
    border-top:1px solid var(--border2);
  }
  .sheet.teal{ border-top-color:var(--teal); }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-head h2{ margin:0; font-size:16px; font-weight:700; }
  .sheet-close{ background:var(--panel2); border:1px solid var(--border); border-radius:999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; flex-shrink:0; }
  #achievement-canvas{ width:100%; aspect-ratio:1/1; border-radius:16px; margin-bottom:14px; background:var(--panel2); display:block; }
  .invite-copied-msg{ font-size:11.5px; color:var(--teal); margin:-8px 0 14px; text-align:center; }

  .field{ display:block; margin-bottom:14px; }
  .field-label{ display:block; font-size:11px; color:var(--muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input, select, textarea{
    width:100%; background:var(--panel); border:1px solid var(--border2); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:14px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--amber); }
  textarea{ resize:vertical; }

  .btn-primary{
    width:100%; padding:13px; border-radius:10px; border:none; background:var(--amber);
    color:var(--on-accent); font-weight:700; font-size:14px; display:flex; align-items:center;
    justify-content:center; gap:6px; cursor:pointer; margin-top:6px;
  }
  .btn-primary.teal{ background:var(--teal); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.06); }

  .tank-hint{ font-size:11px; color:var(--dim); margin:-6px 0 14px; line-height:1.5; }

  .odo-quick-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .odo-quick-btn{
    flex:1 1 18%; min-width:56px; background:var(--panel2); border:1px solid var(--border2); color:var(--muted);
    padding:7px 4px; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .odo-quick-btn:hover{ color:var(--text); border-color:var(--dim2); }
  .odo-quick-btn:active{ background:var(--panel); }

  .gauge-box{ text-align:center; padding:6px 0 4px; }
  .gauge-readout{ margin-top:8px; font-size:13px; font-weight:600; color:var(--text); }

  .photo-picker{ display:flex; align-items:center; gap:14px; }
  .photo-preview, .photo-preview-placeholder{
    width:64px; height:64px; border-radius:12px; object-fit:cover; flex-shrink:0;
    background:var(--panel2); border:1px solid var(--border2); display:flex;
    align-items:center; justify-content:center;
  }
  .photo-actions{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .native-file-input{ font-size:11.5px; color:var(--muted); max-width:220px; padding:0; border:none; background:none; }
  .photo-btn.remove{
    background:transparent; border:1px solid var(--border2); color:var(--red); border-radius:8px;
    padding:6px 10px; font-size:12px; display:inline-flex; align-items:center; gap:4px;
    cursor:pointer; width:fit-content;
  }

  .theme-row{ display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .theme-row.active{ border-color:var(--amber); background:var(--panel); }
  .theme-swatch{ display:flex; flex-shrink:0; }
  .theme-swatch span{ width:16px; height:16px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.25); margin-left:-6px; }
  .theme-swatch span:first-child{ margin-left:0; }
  .theme-name{ flex:1; font-size:14px; }
  .theme-check{ color:var(--amber); display:flex; flex-shrink:0; }

  .vswitch-row{ display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; background:var(--panel); }
  .vswitch-row.active{ border-color:var(--amber); background:var(--panel2); }
  .vswitch-photo{ width:40px; height:40px; border-radius:10px; object-fit:cover; background:var(--panel2); flex-shrink:0; }
  .vswitch-tag{ font-size:9.5px; color:var(--amber); border:1px solid var(--amber); border-radius:999px; padding:1px 6px; margin-left:6px; font-weight:600; }

  .warn-box{ background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:360px; width:90%; }
  .warn-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .warn-head h3{ margin:0; font-size:15px; }
  .warn-text{ font-size:13px; color:var(--muted); line-height:1.55; margin:0 0 18px; }
  .warn-actions{ display:flex; gap:10px; }
  .warn-btn{ flex:1; padding:11px; border-radius:8px; border:none; font-weight:600; font-size:13px; cursor:pointer; }
  .warn-btn.cancel{ background:var(--panel2); color:var(--text); border:1px solid var(--border2); }
  .warn-btn.confirm{ background:var(--red); color:#fff; }

  /* ---------- dashboard ---------- */
  .dash-section h3{ font-size:12.5px; margin:0 0 8px; color:var(--muted); font-weight:600; }
  .dash-filter{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .dash-filter-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  .dash-filter-btn{ padding:8px 14px; border-radius:8px; border:1px solid var(--border2); background:transparent; color:var(--text); font-size:12px; cursor:pointer; }
  .dash-filter-btn.primary{ background:var(--amber); border-color:var(--amber); color:var(--on-accent); font-weight:700; }
  .dash-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; height:250px; position:relative; }
  .dash-card.short{ height:170px; }
  .ov-group-label{ font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim2); font-weight:700; margin:12px 2px 8px; }
  .ov-group-label:first-of-type{ margin-top:0; }
  .ov-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ov-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:11px 12px; min-width:0; }
  .ov-card.highlight{ background:var(--panel2); border-color:var(--border2); }
  .ov-head{ display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted); margin-bottom:7px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ov-val{ font-size:15.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ov-sub{ font-size:10px; color:var(--dim); margin-top:4px; }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:11.5px; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  .dash-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .dash-table th, .dash-table td{ padding:9px 11px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }

  .dash-table tbody tr:hover{ background:var(--panel2); }
  .dash-table tbody tr.active-row{ background:var(--panel2); }
  .dash-table tbody tr:last-child td{ border-bottom:none; }
  .table-plate{ font-size:10.5px; color:var(--dim); font-family:var(--mono); }

  .backup-box{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; }

  .backup-actions{ display:flex; gap:10px; }
  .backup-btn{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--border2); background:var(--panel2); color:var(--text); font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
  .backup-btn:hover{ border-color:var(--dim2); }
  .import-msg{ font-size:11.5px; margin-top:10px; display:flex; align-items:center; gap:6px; }

  @media (max-width:380px){
    .stat-grid{ gap:6px; }
    .odo-digits{ font-size:18px; }
    .tab-btn{ padding:9px 2px; }
  }

  /* ---------- celebração (missão / nível) ---------- */
  .celebrate-overlay{
    position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(255,180,60,.25), rgba(0,0,0,.82) 70%);
    overflow:hidden; animation:celebrateFadeIn .25s ease-out;
  }
  @keyframes celebrateFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .confetti-piece{
    position:absolute; top:-12px; width:9px; height:14px; opacity:.95; border-radius:2px;
    transform:rotate(var(--rot)); animation-name:confettiFall; animation-timing-function:ease-in;
    animation-iteration-count:1; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--drift), 115vh) rotate(calc(var(--rot) + 360deg)); opacity:.85; }
  }
  .celebrate-card{
    position:relative; z-index:1; text-align:center; padding:34px 30px 26px; border-radius:26px;
    background:linear-gradient(160deg, var(--amber), #ff6b6b 65%, #8338ec);
    box-shadow:0 0 0 1px rgba(255,255,255,.15), 0 20px 60px rgba(0,0,0,.55), 0 0 90px rgba(255,180,60,.45);
    max-width:340px; width:88%; animation:celebrateCardPop .55s cubic-bezier(.17,.89,.32,1.28);
    cursor:default;
  }
  .celebrate-card.is-levelup{ background:linear-gradient(160deg, #8338ec, #118ab2 60%, #06d6a0); }
  @keyframes celebrateCardPop{
    0%{ transform:scale(.4) translateY(30px); opacity:0; }
    60%{ transform:scale(1.08) translateY(-4px); opacity:1; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  .celebrate-burst{
    position:absolute; inset:-40%; z-index:-1; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 60%);
    animation:celebratePulse 1.6s ease-out infinite;
  }
  @keyframes celebratePulse{
    0%{ transform:scale(.6); opacity:.9; }
    100%{ transform:scale(1.5); opacity:0; }
  }
  .celebrate-headline{
    font-size:25px; font-weight:900; letter-spacing:.03em; color:#fff; text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,.35); margin-bottom:14px; animation:celebrateShake .5s ease-in-out .1s;
  }
  @keyframes celebrateShake{
    0%, 100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-3deg); }
    40%{ transform:rotate(3deg); }
    60%{ transform:rotate(-2deg); }
    80%{ transform:rotate(2deg); }
  }
  .celebrate-mission{ display:flex; align-items:center; justify-content:center; gap:8px; color:#fff; font-size:15px; font-weight:700; margin-bottom:6px; }
  .celebrate-xp{ font-size:32px; font-weight:900; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.4); animation:celebrateXpPop .5s cubic-bezier(.17,.89,.32,1.28) .15s both; }
  .celebrate-level{ font-size:34px; font-weight:900; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.4); animation:celebrateXpPop .5s cubic-bezier(.17,.89,.32,1.28) .15s both; }
  .celebrate-tier{ font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.9); margin-top:2px; }
  @keyframes celebrateXpPop{
    0%{ transform:scale(.5); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .celebrate-btn{
    margin-top:20px; padding:12px 30px; border:none; border-radius:999px; cursor:pointer;
    background:#fff; color:#222; font-size:14px; font-weight:800; letter-spacing:.02em;
    box-shadow:0 6px 18px rgba(0,0,0,.3); animation:celebrateBtnPop .5s cubic-bezier(.17,.89,.32,1.28) .25s both;
  }
  .celebrate-btn:active{ transform:scale(.96); }
  @keyframes celebrateBtnPop{
    0%{ transform:scale(.6); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

function applyDefaultMaintenanceIntervals(){
  if(!state.maintenanceIntervals) state.maintenanceIntervals = {};
  SERVICE_TYPES_PERIODICO.forEach(function(service){

function dayNumber(dateStr){ return Math.floor(new Date(dateStr+'T00:00:00').getTime() / 86400000); }
// chave da SEMANA de calendário (segunda a domingo) a que uma data pertence — usa a data da segunda-feira como identificador
function weekKeyFor(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  var offset = (d.getDay() + 6) % 7; // segunda=0, terça=1, ..., domingo=6 dias de distância da segunda-feira daquela semana
  d.setDate(d.getDate() - offset);
  return d.toISOString().slice(0,10);
}
// chave do MÊS de calendário a que uma data pertence — 'YYYY-MM'
function monthKeyFor(dateStr){ return dateStr.slice(0,7); }
// último dia (YYYY-MM-DD) da semana ou mês de calendário corrente, usado pra calcular "vence em X dias"
function periodEndDate(mission){
  var today = new Date().toISOString().slice(0,10);
  if(mission.recurrence.value===7){
    var d = new Date(weekKeyFor(today)+'T00:00:00');
    d.setDate(d.getDate()+6);
    return d.toISOString().slice(0,10);
  }
  if(mission.recurrence.value===30){
    var d2 = new Date(today+'T00:00:00');
    var lastDay = new Date(d2.getFullYear(), d2.getMonth()+1, 0);
    return lastDay.toISOString().slice(0,10);
  }
  return null;
}
// qual seria a chave do período ANTERIOR a esta — usado pra checar se duas conclusões são consecutivas (sequência/streak)
function previousPeriodKey(mission, key){
  if(key==null) return null;
  if(mission.recurrence.value===7){
    var d = new Date(key+'T00:00:00');
    d.setDate(d.getDate()-7);
    return d.toISOString().slice(0,10);
  }
  if(mission.recurrence.value===30){
    var parts = key.split('-');
    var y = Number(parts[0]), m = Number(parts[1])-1;
    if(m<1){ m=12; y-=1; }
    return y+'-'+(m<10?'0':'')+m;
  }
  var n = Number(key);
  return isNaN(n) ? null : String(n-1);
}
function periodKeyForMission(mission, record){
  if(mission.recurrence.type==='daily') return record.date;
  if(mission.recurrence.type==='days'){
    if(mission.recurrence.value===7) return weekKeyFor(record.date);
    if(mission.recurrence.value===30) return monthKeyFor(record.date);
    return String(Math.floor(dayNumber(record.date) / mission.recurrence.value)); // prazos customizados continuam em blocos corridos
  }
  if(mission.recurrence.type==='km'){
    var odo = Number(record.odometer);
    if(isNaN(odo)) return null;
    return String(Math.floor(odo / mission.recurrence.value));
  }
  return null;
}
// XP cumulativo necessário para alcançar um nível (nível 1 começa em 0 XP; cada nível fica um pouco mais difícil)
function xpForLevel(level){
  var total = 0;
  for(var i=1;i<level;i++){ total += 100 + (i-1)*40; }
  return total;
}
function getLevelInfo(xp){
  xp = xp || 0;
  var level = 1;
  while(xpForLevel(level+1) <= xp && level < 200){ level++; }
  var floorXp = xpForLevel(level);
  var span = xpForLevel(level+1) - floorXp;
  return { level:level, xpTotal:xp, xpIntoLevel:xp-floorXp, xpForNextLevel:span };
}
// Paleta de cores por faixa de nível — o visual do card de nível evolui conforme o usuário avança.
function getLevelTier(level){
  if(level>=30) return { name:'Lendário', gradient:'linear-gradient(135deg,#a855f7,#ec4899 55%,#f59e0b)' };
  if(level>=20) return { name:'Diamante', gradient:'linear-gradient(135deg,#7dd3fc,#6366f1)' };
  if(level>=15) return { name:'Platina', gradient:'linear-gradient(135deg,#5eead4,#0d9488)' };
  if(level>=10) return { name:'Ouro', gradient:'linear-gradient(135deg,#fde68a,#f59e0b)' };
  if(level>=5) return { name:'Prata', gradient:'linear-gradient(135deg,#e5e7eb,#94a3b8)' };
  return { name:'Bronze', gradient:'linear-gradient(135deg,#e3a469,#a5672c)' };
}

// Pontos da engrenagem de 10 dentes (viewBox 48x48, centro em 24,24) — usados tanto no brasão em
// HTML/SVG (gearBadge) quanto no desenho em <canvas> da imagem de conquista (drawAchievementCanvas).
var GEAR_PTS = [[24.0,3.0],[29.1,8.3],[36.3,7.0],[37.3,14.3],[44.0,17.5],[40.5,24.0],[44.0,30.5],[37.3,33.7],[36.3,41.0],[29.1,39.7],[24.0,45.0],[18.9,39.7],[11.7,41.0],[10.7,33.7],[4.0,30.5],[7.5,24.0],[4.0,17.5],[10.7,14.3],[11.7,7.0],[18.9,8.3]];
function gearBadge(size, tierName, opts){
  opts = opts || {};
  var tier = BADGE_TIERS.find(function(t){ return t.name===tierName; }) || BADGE_TIERS[0];
  var pts = GEAR_PTS.map(function(p){ return p[0]+','+p[1]; }).join(' ');
  var lockedClass = opts.locked ? ' locked' : '';
  var lvlTag = (opts.level!=null) ? '<div class="lvl-tag">'+opts.level+'</div>' : '';
  var lockTag = opts.locked ? '<div class="lock-tag"><svg width="'+Math.round(size*0.32)+'" height="'+Math.round(size*0.32)+'" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>' : '';
  var iconSize = Math.round(size*0.62);
  var iconOff = Math.round((size-iconSize)/2);
  return '' +
  '<div class="gear-badge'+lockedClass+'" style="width:'+size+'px;height:'+size+'px;">' +
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 48 48">' +
      '<polygon points="'+pts+'" fill="url(#bg-'+tier.key+')"/>' +
    '</svg>' +
    '<img src="'+BADGE_ICON[tier.key]+'" style="position:absolute; top:'+iconOff+'px; left:'+iconOff+'px; width:'+iconSize+'px; height:'+iconSize+'px; pointer-events:none;">' +
    lvlTag + lockTag +
  '</div>';
}
// Desenha o mesmo contorno em engrenagem no <canvas> (imagem de "compartilhar conquista"),
// centralizado em (cx,cy) com raio r — geometria idêntica à do brasão em HTML/SVG, sem sombra.
function drawGearBadgePath(ctx, cx, cy, r){
  var scale = r / 21; // 21 ≈ maior distância do centro (24,24) até um ponto da engrenagem no viewBox 48x48
  ctx.beginPath();
  GEAR_PTS.forEach(function(p, i){
    var x = cx + (p[0]-24)*scale;

// Concede o XP de uma missão cumprida num período, aplicando bônus de SEQUÊNCIA (streak):
// cada período consecutivo cumprido (sem pular nenhum) aumenta o XP ganho em +20% do valor base da missão,
// até um teto de +5 níveis (ou seja, no máximo o dobro do XP base). Se a sequência for quebrada — ou seja,
// o período concedido não é imediatamente seguinte ao último concedido — a sequência reinicia em 1
// e a pontuação volta ao valor base da missão.
function grantMissionCompletion(mission, vehicleId, periodKey, recordDate){
  if(!state.gamification) state.gamification = { xp:0, completions:{}, streaks:{} };
  if(!state.gamification.streaks) state.gamification.streaks = {};
  var key = mission.id+'|'+vehicleId+'|'+periodKey;
  if(state.gamification.completions[key]) return null; // já concedida nesse período

  var streakKey = mission.id+'|'+vehicleId;
  var streakInfo = state.gamification.streaks[streakKey] || { count:0, lastPeriodKey:null };
  var isConsecutive = streakInfo.lastPeriodKey!=null && streakInfo.lastPeriodKey===previousPeriodKey(mission, periodKey);
  var newCount = isConsecutive ? streakInfo.count+1 : 1;

  var bonusSteps = Math.min(newCount-1, 5); // trava o bônus em +5 níveis (+100% do XP base)
  var awardedXp = mission.xp + bonusSteps*Math.round(mission.xp*0.2);

  var levelBefore = getLevelInfo(state.gamification.xp).level;
  state.gamification.completions[key] = { date: recordDate, xp: awardedXp, streak: newCount };
  state.gamification.xp = (state.gamification.xp||0) + awardedXp;
  state.gamification.streaks[streakKey] = { count: newCount, lastPeriodKey: periodKey };
  var levelAfter = getLevelInfo(state.gamification.xp).level;

  return { xp: awardedXp, streak: newCount, levelBefore: levelBefore, levelAfter: levelAfter };
}
// Registra automaticamente o cumprimento de missões quando um novo lançamento é salvo.
// Cada (missão + veículo + período) só concede XP uma única vez.
function evaluateMissionsForRecord(record, recordType){
  if(!record || !record.vehicleId) return;
  if(!state.gamification) state.gamification = { xp:0, completions:{}, streaks:{} };
  MISSIONS.forEach(function(mission){
    if(!mission.matches(record, recordType)) return;
    var pk = periodKeyForMission(mission, record);
    if(pk==null) return;

    if(mission.cumulative){
      var all = getRecordsForType(record.vehicleId, recordType).filter(function(r){
        return mission.matches(r, recordType) && periodKeyForMission(mission, r)===pk;
      });
      var sum = all.reduce(function(s,r){ return s + mission.valueOf(r); }, 0);
      if(sum < mission.target) return; // ainda não bateu a meta neste período
    }

    var result = grantMissionCompletion(mission, record.vehicleId, pk, record.date);
    if(!result) return;
    queueCelebration({ type:'mission', title: mission.title, xp: result.xp, icon: mission.icon });
    if(result.levelAfter > result.levelBefore){
      queueCelebration({ type:'levelup', level: result.levelAfter });
    }
  });
}
function getRecordsForType(vehicleId, type){
  if(type==='manutencao') return state.maintenance.filter(function(m){return m.vehicleId===vehicleId;});
  if(type==='combustivel') return state.fuel.filter(function(f){return f.vehicleId===vehicleId;});
  if(type==='ocorrencia') return state.occurrences.filter(function(o){return o.vehicleId===vehicleId;});
  if(type==='percurso') return (state.percursos||[]).filter(function(p){return p.vehicleId===vehicleId;});
  return [];
}
// Reavalia todo o histórico já registrado contra as definições atuais das missões — usado quando os prazos/critérios
// de uma missão mudam, pra que dados já preenchidos sejam contabilizados na barra de XP sem precisar de um novo lançamento.
// Processa os registros em ORDEM CRONOLÓGICA por missão, pra que o bônus de sequência seja reconstruído corretamente.
// Não dispara comemoração (é uma atualização silenciosa de sistema, não uma ação do usuário no momento).
function backfillMissions(){
  if(!state.gamification) state.gamification = { xp:0, completions:{}, streaks:{} };
  if(!state.gamification.streaks) state.gamification.streaks = {};
  state.vehicles.forEach(function(v){
    MISSIONS.forEach(function(mission){
      if(mission.trigger==='navigation') return; // não depende de nenhum registro
      var matchingRecords = [];
      ['manutencao','combustivel','ocorrencia','percurso'].forEach(function(type){
        getRecordsForType(v.id, type).forEach(function(r){
          if(mission.matches(r, type)) matchingRecords.push(r);
        });
      });
      if(!matchingRecords.length) return;
      matchingRecords.sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });

      var periodsInOrder = [];
      var periodSums = {};
      var periodLastDate = {};
      matchingRecords.forEach(function(r){
        var pk = periodKeyForMission(mission, r);
        if(pk==null) return;
        if(!(pk in periodSums)){ periodSums[pk] = 0; periodsInOrder.push(pk); }
        if(mission.cumulative) periodSums[pk] += mission.valueOf(r);
        periodLastDate[pk] = r.date; // mantém a data do lançamento mais recente daquele período
      });

      periodsInOrder.forEach(function(pk){
        if(mission.cumulative && periodSums[pk] < mission.target) return;
        grantMissionCompletion(mission, v.id, pk, periodLastDate[pk]);
      });
    });
  });
}
// Reverte o cumprimento de uma missão quando o registro que a justificava é excluído,
// descontando o XP concedido — mas só se nenhum outro registro remanescente ainda a justificar.
// Recalcula do zero o estado de sequência (streak) de uma missão, a partir de quais períodos ainda têm
// conquista registrada — usado depois de excluir um registro, pra que buracos na sequência sejam
// reconhecidos corretamente (em vez de o app continuar contando como se nada tivesse sido excluído).
function recomputeStreakForMission(missionId, vehicleId){
  if(!state.gamification || !state.gamification.completions) return;
  var mission = MISSIONS.filter(function(m){ return m.id===missionId; })[0];
  if(!mission) return;
  var prefix = missionId+'|'+vehicleId+'|';
  var periodKeys = Object.keys(state.gamification.completions)
    .filter(function(k){ return k.indexOf(prefix)===0; })
    .map(function(k){ return k.slice(prefix.length); })
    .sort();
  var streakKey = missionId+'|'+vehicleId;
  if(!state.gamification.streaks) state.gamification.streaks = {};
  if(periodKeys.length===0){
    delete state.gamification.streaks[streakKey];
    return;
  }
  var count = 1;
  for(var i=1;i<periodKeys.length;i++){
    var prevExpected = previousPeriodKey(mission, periodKeys[i]);
    count = (prevExpected===periodKeys[i-1]) ? (count+1) : 1;
  }
  state.gamification.streaks[streakKey] = { count: count, lastPeriodKey: periodKeys[periodKeys.length-1] };
}
function revokeMissionsForRecord(record, recordType){
  if(!record || !record.vehicleId) return;
  if(!state.gamification || !state.gamification.completions) return;
  var collection = getRecordsForType(record.vehicleId, recordType);
  MISSIONS.forEach(function(mission){
    if(!mission.matches(record, recordType)) return;
    var pk = periodKeyForMission(mission, record);
    if(pk==null) return;
    var key = mission.id+'|'+record.vehicleId+'|'+pk;
    var completion = state.gamification.completions[key];
    if(!completion) return; // essa conquista nem existia — nada a reverter
    var stillJustified;
    if(mission.cumulative){
      var sum = collection.filter(function(r){ return mission.matches(r, recordType) && periodKeyForMission(mission, r)===pk; })
        .reduce(function(s,r){ return s + mission.valueOf(r); }, 0);
      stillJustified = sum >= mission.target;
    } else {
      stillJustified = collection.some(function(r){ return mission.matches(r, recordType) && periodKeyForMission(mission, r)===pk; });
    }
    if(!stillJustified){
      var xpToRemove = completion.xp || mission.xp;
      delete state.gamification.completions[key];
      state.gamification.xp = Math.max(0, (state.gamification.xp||0) - xpToRemove);
      recomputeStreakForMission(mission.id, record.vehicleId);
    }
  });
}
function periodKeyNow(mission, vehicleId){
  if(mission.recurrence.type==='daily') return new Date().toISOString().slice(0,10);
  if(mission.recurrence.type==='days'){
    var today = new Date().toISOString().slice(0,10);
    if(mission.recurrence.value===7) return weekKeyFor(today);
    if(mission.recurrence.value===30) return monthKeyFor(today);
    return String(Math.floor(dayNumber(today) / mission.recurrence.value));
  }
  if(mission.recurrence.type==='km' && vehicleId){
    var stats = computeStatsForVehicle(vehicleId);
    return String(Math.floor(stats.currentOdo / mission.recurrence.value));
  }
  return null;
}
function evaluateNavigationMissions(vehicleId){
  if(!vehicleId) return;
  if(!state.gamification) state.gamification = { xp:0, completions:{}, streaks:{} };
  MISSIONS.forEach(function(mission){
    if(mission.trigger !== 'navigation') return;
    var pk = periodKeyNow(mission, vehicleId);
    if(pk==null) return;
    var result = grantMissionCompletion(mission, vehicleId, pk, new Date().toISOString().slice(0,10));
    if(!result) return;
    queueCelebration({ type:'mission', title: mission.title, xp: result.xp, icon: mission.icon });
    if(result.levelAfter > result.levelBefore){
      queueCelebration({ type:'levelup', level: result.levelAfter });
    }
  });
}
function missionPeriodLabel(mission){
  if(mission.recurrence.type==='days'){
    if(mission.recurrence.value===7) return 'semanal';
    if(mission.recurrence.value===30) return 'mensal';
    return 'a cada '+mission.recurrence.value+' dias';
  }
  if(mission.recurrence.type==='daily') return 'diária';
  return '';
}
function periodLabel(mission){
  if(mission.recurrence.type==='days'){
    if(mission.recurrence.value===7) return 'semanal';
    if(mission.recurrence.value===30) return 'mensal';
  }
  return null;
}
function computeMissionStatus(mission, vehicleId){
  var records = state.maintenance.filter(function(m){return m.vehicleId===vehicleId;}).map(function(m){return {rec:m, type:'manutencao'};})
    .concat(state.fuel.filter(function(f){return f.vehicleId===vehicleId;}).map(function(f){return {rec:f, type:'combustivel'};}))
    .concat(state.occurrences.filter(function(o){return o.vehicleId===vehicleId;}).map(function(o){return {rec:o, type:'ocorrencia'};}))
    .concat((state.percursos||[]).filter(function(p){return p.vehicleId===vehicleId;}).map(function(p){return {rec:p, type:'percurso'};}));
  var matching = records.filter(function(r){ return mission.matches(r.rec, r.type); });
  var nowKey = periodKeyNow(mission, vehicleId);
  var done = !!(state.gamification && state.gamification.completions[mission.id+'|'+vehicleId+'|'+nowKey]);
  var lastMatch = matching.length ? matching.reduce(function(a,b){ return (!a || b.rec.date>a.rec.date) ? b : a; }, null) : null;
  var subtitle;
  if(mission.cumulative){
    var matchingNow = matching.filter(function(r){ return periodKeyForMission(mission, r.rec)===nowKey; });
    var sumNow = matchingNow.reduce(function(s,r){ return s + mission.valueOf(r.rec); }, 0);
    var progressPct = Math.max(0, Math.min(100, Math.round((sumNow/mission.target)*100)));
    var completionNow = state.gamification && state.gamification.completions[mission.id+'|'+vehicleId+'|'+nowKey];
    var streakTxtCum = (completionNow && completionNow.streak>1) ? (' · 🔥 '+completionNow.streak+'x seguidas') : '';
    subtitle = done
      ? ('Meta batida: '+formatKm(mission.target)+' neste período'+(periodLabel(mission) ? ' ('+periodLabel(mission)+')' : '')+streakTxtCum)
      : (formatKm(sumNow)+' de '+formatKm(mission.target)+' neste período');
    return { done: done, subtitle: subtitle, xp: mission.xp, cumulative:true, progressPct: progressPct };
  }
  if(mission.trigger==='navigation'){
    var navCompletion = state.gamification && state.gamification.completions[mission.id+'|'+vehicleId+'|'+nowKey];
    var navStreakTxt = (navCompletion && navCompletion.streak>1) ? (' · 🔥 '+navCompletion.streak+'x seguidas') : '';
    subtitle = done ? ('Concluída neste período'+(periodLabel(mission) ? ' ('+periodLabel(mission)+')' : '')+navStreakTxt) : 'Basta abrir o app · repete a cada '+mission.recurrence.value+' dias';
  } else if(mission.recurrence.type==='daily'){
    subtitle = done ? 'Concluída hoje' : 'Ainda pendente hoje';
  } else if(mission.recurrence.type==='days'){
    var streakNow = state.gamification && state.gamification.completions[mission.id+'|'+vehicleId+'|'+nowKey] && state.gamification.completions[mission.id+'|'+vehicleId+'|'+nowKey].streak;
    var streakTxt = (streakNow && streakNow>1) ? (' · 🔥 '+streakNow+'x seguidas') : '';
    if(done){ subtitle = 'Em dia neste período'+(periodLabel(mission) ? ' ('+periodLabel(mission)+')' : '')+streakTxt; }
    else {
      var endDate = periodEndDate(mission);
      var daysLeft = endDate!=null ? (dayNumber(endDate) - dayNumber(new Date().toISOString().slice(0,10))) : null;
      subtitle = (daysLeft==null ? '' : (daysLeft<=0 ? 'Vence hoje' : 'Vence em '+daysLeft+' dia(s)')+' · ')+'repete a cada '+mission.recurrence.value+' dias';
    }
  } else if(mission.recurrence.type==='km'){
    if(done){ subtitle = 'Em dia neste período'; }
    else if(lastMatch && !isNaN(Number(lastMatch.rec.odometer))){
      var stats2 = computeStatsForVehicle(vehicleId);
      var kmSince = Math.max(0, stats2.currentOdo - Number(lastMatch.rec.odometer));
      subtitle = formatKm(kmSince)+' desde a última · repete a cada '+mission.recurrence.value.toLocaleString('pt-BR')+' km';
    } else { subtitle = 'Nunca registrada · repete a cada '+mission.recurrence.value.toLocaleString('pt-BR')+' km'; }
  }
  return { done: done, subtitle: subtitle, xp: mission.xp };
}

const GEO_MATCH_RADIUS_M = 200; // distância máxima pra considerar que a localização atual "é" um local já salvo
function haversineDistanceMeters(lat1, lon1, lat2, lon2){
  var R = 6371000;
  var toRad = function(d){ return d*Math.PI/180; };
  var dLat = toRad(lat2-lat1);
  var dLon = toRad(lon2-lon1);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
function findNearestSavedLocation(category, lat, lng){
  var list = (state.locations && state.locations[category]) || [];
  var best = null, bestDist = Infinity;
  list.forEach(function(loc){
    if(loc.lat==null || loc.lng==null) return;
    var d = haversineDistanceMeters(lat, lng, loc.lat, loc.lng);
    if(d < bestDist){ bestDist = d; best = loc; }
  });
  return (best && bestDist <= GEO_MATCH_RADIUS_M) ? best : null;
}
function reverseGeocode(lat, lng, callback){
  // usa o Nominatim (OpenStreetMap) — serviço gratuito de geocodificação reversa, sem precisar de chave de API
  var url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1';
  fetch(url, { headers: { 'Accept-Language': 'pt-BR' } })
    .then(function(r){ return r.json(); })
    .then(function(data){ callback(data && data.display_name ? data.display_name : null); })
    .catch(function(){ callback(null); });
}
function findLocationByAddress(category, address){
  var list = (state.locations && state.locations[category]) || [];
  var norm = (address||'').trim().toLowerCase();
  if(!norm) return null;
  for(var i=0;i<list.length;i++){
    if((list[i].address||'').trim().toLowerCase()===norm) return list[i];
  }
  return null;
}
function findLocationById(category, id){

function locationDisplayName(category, address){

function saveLocationIfNew(category, address, name, lat, lng){
  if(!state.locations) state.locations = { manutencao:[], combustivel:[], ocorrencia:[] };
  if(!state.locations[category]) state.locations[category] = [];
  var addr = (address||'').trim();
  if(!addr) return;
  var existing = findLocationByAddress(category, addr);
  if(existing){
    if(name && name.trim() && existing.name !== name.trim()){ existing.name = name.trim(); }
    if(lat!=null && lng!=null && (existing.lat==null || existing.lng==null)){ existing.lat = lat; existing.lng = lng; }
    return;
  }
  var finalName = (name && name.trim()) ? name.trim() : addr;
  var newLoc = { id: uid(), name: finalName, address: addr };
  if(lat!=null && lng!=null){ newLoc.lat = lat; newLoc.lng = lng; }
  state.locations[category].push(newLoc);
}
function resizeImageFile(file, maxDim, cb){
  try{
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var img = new Image();
        img.onload = function(){
          try{
            var w = img.width, h = img.height;
            var scale = Math.min(1, maxDim/Math.max(w,h));
            var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            var url = canvas.toDataURL('image/jpeg', 0.82);
            cb(url, null);
          }catch(err2){ cb(null, 'Falha ao processar a imagem (canvas): '+err2.message); }
        };
        img.onerror = function(){ cb(null, 'Não foi possível carregar a imagem selecionada.'); };
        img.src = e.target.result;
      }catch(err1){ cb(null, 'Falha ao ler a imagem: '+err1.message); }
    };
    reader.onerror = function(){ cb(null, 'Não foi possível acessar o arquivo selecionado.'); };
    reader.readAsDataURL(file);
  }catch(err0){ cb(null, 'Falha inesperada ao processar a foto: '+err0.message); }
}

function applyMoneyMask(el){
  var digits = el.value.replace(/\D/g,'');
  digits = digits.replace(/^0+(?=\d)/,'');
  if(digits===''){ el.value=''; return; }
  while(digits.length<3) digits = '0'+digits;
  var intPart = digits.slice(0,-2).replace(/^0+(?=\d)/,'') || '0';
  var decPart = digits.slice(-2);
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  el.value = intPart+','+decPart;
}

function formatMonthsDays(totalDays){

  var months = Math.floor(totalDays/30);
  var days = totalDays%30;
  if(months<=0) return days+(days===1?' dia':' dias');
  if(days<=0) return months+(months===1?' mês':' meses');
  return months+(months===1?' mês':' meses')+' e '+days+(days===1?' dia':' dias');
}
function formatDate(d){ if(!d) return '—'; var parts=d.split('-'); return parts[2]+'/'+parts[1]+'/'+parts[0]; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- persistence ---------- */
function applyLoadedData(parsed){
  parsed = parsed || {};
  state.maintenance = parsed.maintenance || [];
  state.fuel = parsed.fuel || [];
  state.occurrences = parsed.occurrences || [];
  state.maintenanceIntervals = parsed.maintenanceIntervals || {};
  state.gamification = (parsed.gamification && typeof parsed.gamification==='object')
    ? { xp: Number(parsed.gamification.xp)||0, completions: parsed.gamification.completions || {} }
    : { xp: 0, completions: {} };
  var loadedLocations = (parsed.locations && typeof parsed.locations==='object') ? parsed.locations : {};
  state.locations = {
    manutencao: Array.isArray(loadedLocations.manutencao) ? loadedLocations.manutencao : [],
    combustivel: Array.isArray(loadedLocations.combustivel) ? loadedLocations.combustivel : [],
    ocorrencia: Array.isArray(loadedLocations.ocorrencia) ? loadedLocations.ocorrencia : []
  };
  state.odometerLogs = Array.isArray(parsed.odometerLogs) ? parsed.odometerLogs : [];
  state.tabSoundEnabled = (parsed.tabSoundEnabled!==false);
  state.fuelGaugeEnabled = (parsed.fuelGaugeEnabled!==false);
  state.percursos = Array.isArray(parsed.percursos) ? parsed.percursos : [];
  state.contacts = (parsed.contacts && typeof parsed.contacts==='object') ? parsed.contacts : {};
  if(Array.isArray(parsed.vehicles)){
    state.vehicles = parsed.vehicles;
    state.activeVehicleId = parsed.activeVehicleId || (parsed.vehicles[0] && parsed.vehicles[0].id) || null;
  } else if(parsed.vehicle && (parsed.vehicle.plate || parsed.vehicle.brand || parsed.vehicle.model)){
    // migrate legacy single-vehicle format
    var legacyId = uid();
    state.vehicles = [Object.assign({}, parsed.vehicle, {id: legacyId})];
    state.activeVehicleId = legacyId;
    state.maintenance.forEach(function(m){ if(!m.vehicleId) m.vehicleId = legacyId; });
    state.fuel.forEach(function(f){ if(!f.vehicleId) f.vehicleId = legacyId; });
  }
  applyDefaultMaintenanceIntervals();
}
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ applyLoadedData(JSON.parse(raw)); }
    else { applyDefaultMaintenanceIntervals(); }
  }catch(e){ applyDefaultMaintenanceIntervals(); /* start empty */ }
}
function buildSyncPayload(){
  return { maintenance: state.maintenance, fuel: state.fuel, occurrences: state.occurrences, vehicles: state.vehicles, activeVehicleId: state.activeVehicleId, maintenanceIntervals: state.maintenanceIntervals, gamification: state.gamification, locations: state.locations, odometerLogs: state.odometerLogs, tabSoundEnabled: state.tabSoundEnabled, fuelGaugeEnabled: state.fuelGaugeEnabled, percursos: state.percursos, contacts: state.contacts };
}
function persistToCloud(){
  if(!authUser || !window.__fb) return;
  window.__fb.saveToCloud(authUser.uid, buildSyncPayload()).catch(function(){ /* falha silenciosa (ex: offline) — os dados continuam salvos localmente e a próxima ação tenta sincronizar de novo */ });
  syncLeaderboardEntry();
}
// Mantém a entrada pública de ranking (coleção "leaderboard") em dia com o nível/XP atual —
// é uma cópia mínima e não-sensível (nome, e-mail, xp, nível) só pra permitir o ranking entre amigos.
function syncLeaderboardEntry(){
  if(!authUser || !window.__fb) return;
  var lvl = getLevelInfo((state.gamification && state.gamification.xp) || 0);
  window.__fb.saveLeaderboardEntry(authUser.uid, {
    email: authUser.email.toLowerCase(),
    name: authUser.displayName || authUser.email,
    xp: lvl.xpTotal,
    level: lvl.level
  }).catch(function(){ /* falha silenciosa — o ranking só fica um pouco desatualizado até a próxima sincronização */ });
}
function persist(){
  state.saving = true;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSyncPayload()));
    state.errorMsg = '';
  }catch(e){
    state.errorMsg = 'Não foi possível salvar. O armazenamento do navegador pode estar cheio ou bloqueado.';
  }
  state.saving = false;
  persistToCloud();
  render();
}

function getVehicleLabel(v){
  if(!v) return 'Veículo';
  var title = (v.brand || v.model) ? (v.brand+' '+v.model).trim() : (v.plate || 'Veículo sem nome');
  return title;
}

function getVolumeAfter(entry, fallbackCapacity){
  var cap = entry.tankCapacityAtEntry || fallbackCapacity || DEFAULT_TANK_CAPACITY;
  if(entry.gaugeBefore!=null){
    var before = entry.gaugeBefore * cap;
    return Math.min(before + Number(entry.liters||0), cap);
  }
  if(entry.fullTank) return cap; // legacy entries saved before the gauge feature
  return null; // legacy entry without gauge data — unknown tank level after fill
}
function getVolumeBefore(entry, fallbackCapacity){
  var cap = entry.tankCapacityAtEntry || fallbackCapacity || DEFAULT_TANK_CAPACITY;
  if(entry.gaugeBefore!=null) return entry.gaugeBefore * cap;
  return null;
}

function computeStatsForVehicle(vehicleId, dateStart, dateEnd){
  var vehicle = state.vehicles.find(function(v){ return v.id===vehicleId; });
  var vehicleCapacity = vehicle ? vehicle.tankCapacity : DEFAULT_TANK_CAPACITY;
  var maint = state.maintenance.filter(function(m){ return m.vehicleId === vehicleId; });
  var fuelList = state.fuel.filter(function(f){ return f.vehicleId === vehicleId; });
  var occList = state.occurrences.filter(function(o){ return o.vehicleId === vehicleId; });
  if(dateStart){ maint = maint.filter(function(m){return m.date>=dateStart;}); fuelList = fuelList.filter(function(f){return f.date>=dateStart;}); occList = occList.filter(function(o){return o.date>=dateStart;}); }
  if(dateEnd){ maint = maint.filter(function(m){return m.date<=dateEnd;}); fuelList = fuelList.filter(function(f){return f.date<=dateEnd;}); occList = occList.filter(function(o){return o.date<=dateEnd;}); }

  var odoLogList = (state.odometerLogs||[]).filter(function(o){ return o.vehicleId === vehicleId; });
  if(dateStart){ odoLogList = odoLogList.filter(function(o){return o.date>=dateStart;}); }
  if(dateEnd){ odoLogList = odoLogList.filter(function(o){return o.date<=dateEnd;}); }

  var totalManutencao = maint.reduce(function(s,m){return s+Number(m.cost||0);},0);
  var totalCombustivel = fuelList.reduce(function(s,f){return s+Number(f.cost||0);},0);
  var allOdo = maint.map(function(m){return Number(m.odometer);})
    .concat(fuelList.map(function(f){return Number(f.odometer);}))
    .concat(odoLogList.map(function(o){return Number(o.odometer);}))
    .filter(function(n){return !isNaN(n);});
  var initOdo = (vehicle && vehicle.initialOdometer!=null && !isNaN(Number(vehicle.initialOdometer))) ? Number(vehicle.initialOdometer) : null;
  var odoCandidates = allOdo.concat(initOdo!=null ? [initOdo] : []);
  var currentOdo = odoCandidates.length ? Math.max.apply(null, odoCandidates) : 0;
  var totalKmTraveled;
  if(initOdo!=null){
    totalKmTraveled = Math.max(0, currentOdo - initOdo);
  } else {
    totalKmTraveled = allOdo.length>=2 ? (Math.max.apply(null, allOdo) - Math.min.apply(null, allOdo)) : 0;
  }

  var recordsWithOdo = maint.concat(fuelList).filter(function(r){ return r.date && !isNaN(Number(r.odometer)); });
  var firstRecord = recordsWithOdo.length ? recordsWithOdo.reduce(function(earliest,r){ return (!earliest || r.date<earliest.date) ? r : earliest; }, null) : null;
  var avgKmPerDay = null;
  if(firstRecord){
    var firstDate = new Date(firstRecord.date+'T00:00:00');
    var today = new Date(); today.setHours(0,0,0,0);
    var daysSinceFirst = Math.max(1, Math.round((today - firstDate) / 86400000));
    avgKmPerDay = Math.max(0, (currentOdo - Number(firstRecord.odometer)) / daysSinceFirst);
  }

  var fuelByOdo = fuelList.filter(function(f){return !isNaN(Number(f.odometer));}).slice().sort(function(a,b){return a.odometer-b.odometer;});
  var totalKm=0, totalLitros=0;
  var consumptionTrend = [];
  for(var i=1;i<fuelByOdo.length;i++){
    var prev = fuelByOdo[i-1], cur = fuelByOdo[i];
    var dist = Number(cur.odometer) - Number(prev.odometer);
    var volAfterPrev = getVolumeAfter(prev, vehicleCapacity);
    var volBeforeCur = getVolumeBefore(cur, vehicleCapacity);
    var consumed = (volAfterPrev!=null && volBeforeCur!=null) ? (volAfterPrev - volBeforeCur) : Number(cur.liters||0);
    if(dist>0 && consumed>0){
      totalKm += dist; totalLitros += consumed;
      consumptionTrend.push({ label: formatDate(cur.date), kml: Number((dist/consumed).toFixed(2)) });
    }
  }
  var avgConsumo = totalLitros>0 ? totalKm/totalLitros : null;

  var lastKml = consumptionTrend.length ? consumptionTrend[consumptionTrend.length-1].kml : null;

  var allDatesForDays = maint.map(function(m){return m.date;})
    .concat(fuelList.map(function(f){return f.date;}))
    .concat(occList.map(function(o){return o.date;}))
    .filter(Boolean);
  var lastRecordDate = allDatesForDays.length ? allDatesForDays.reduce(function(a,b){return b>a?b:a;}) : null;
  var totalDaysUsed = null;
  if(vehicle && vehicle.acquisitionDate && lastRecordDate){
    var dAcq = new Date(vehicle.acquisitionDate+'T00:00:00');
    var dLast = new Date(lastRecordDate+'T00:00:00');
    totalDaysUsed = Math.max(0, Math.round((dLast - dAcq) / 86400000));
  }

  var monthMap = {};
  maint.forEach(function(m){ var k=(m.date||'').slice(0,7); if(!k) return; monthMap[k]=monthMap[k]||{month:k,manutencao:0,combustivel:0}; monthMap[k].manutencao+=Number(m.cost||0); });
  fuelList.forEach(function(f){ var k=(f.date||'').slice(0,7); if(!k) return; monthMap[k]=monthMap[k]||{month:k,manutencao:0,combustivel:0}; monthMap[k].combustivel+=Number(f.cost||0); });
  var monthly = Object.keys(monthMap).map(function(k){return monthMap[k];}).sort(function(a,b){return a.month>b.month?1:-1;});

  var serviceMap = {};
  maint.forEach(function(m){ var k=m.description||'Outro'; serviceMap[k]=(serviceMap[k]||0)+Number(m.cost||0); });
  var serviceBreakdown = Object.keys(serviceMap).map(function(name){return {name:name, value:serviceMap[name]};});

  var totalOcorrencias = occList.length;
  var totalCustoOcorrencias = occList.reduce(function(s,o){return s+Number(o.cost||0);},0);
  var occMap = {};
  occList.forEach(function(o){ var k=o.description||'Outro'; occMap[k]=(occMap[k]||0)+1; });
  var occurrenceBreakdown = Object.keys(occMap).map(function(name){return {name:name, value:occMap[name]};});

  var totalAllCosts = Number(totalManutencao||0) + Number(totalCombustivel||0) + Number(totalCustoOcorrencias||0);
  var costPerMonth = (totalDaysUsed && totalDaysUsed>0) ? (totalAllCosts/totalDaysUsed)*30 : null;

  // ---- mês atual: usado no cabeçalho (só faz sentido na chamada sem filtro de período, que é o caso de computeStats()) ----
  var MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var nowDate = new Date();
  var monthKeyNow = nowDate.getFullYear()+'-'+String(nowDate.getMonth()+1).padStart(2,'0');
  var monthStartStr = monthKeyNow+'-01';
  var monthManutencao = maint.filter(function(m){ return (m.date||'').slice(0,7)===monthKeyNow; }).reduce(function(s,m){return s+Number(m.cost||0);},0);
  var monthCombustivel = fuelList.filter(function(f){ return (f.date||'').slice(0,7)===monthKeyNow; }).reduce(function(s,f){return s+Number(f.cost||0);},0);
  var beforeMonthOdo = maint.filter(function(m){return m.date && m.date<monthStartStr && !isNaN(Number(m.odometer));}).map(function(m){return Number(m.odometer);})
    .concat(fuelList.filter(function(f){return f.date && f.date<monthStartStr && !isNaN(Number(f.odometer));}).map(function(f){return Number(f.odometer);}))
    .concat(odoLogList.filter(function(o){return o.date && o.date<monthStartStr && !isNaN(Number(o.odometer));}).map(function(o){return Number(o.odometer);}));
  if(initOdo!=null && (!vehicle || !vehicle.acquisitionDate || vehicle.acquisitionDate<monthStartStr)){ beforeMonthOdo.push(initOdo); }
  var kmThisMonth = beforeMonthOdo.length ? Math.max(0, currentOdo - Math.max.apply(null, beforeMonthOdo)) : null;
  var monthLabelRaw = MESES_PT[nowDate.getMonth()]+' '+nowDate.getFullYear();
  var monthLabel = monthLabelRaw.charAt(0).toUpperCase()+monthLabelRaw.slice(1);

  return { totalManutencao:totalManutencao, totalCombustivel:totalCombustivel, currentOdo:currentOdo, totalKmTraveled:totalKmTraveled, avgKmPerDay:avgKmPerDay, avgConsumo:avgConsumo, lastKml:lastKml, monthly:monthly, serviceBreakdown:serviceBreakdown, consumptionTrend:consumptionTrend, totalOcorrencias:totalOcorrencias, totalCustoOcorrencias:totalCustoOcorrencias, occurrenceBreakdown:occurrenceBreakdown, totalDaysUsed:totalDaysUsed, costPerMonth:costPerMonth, kmThisMonth:kmThisMonth, monthManutencao:monthManutencao, monthCombustivel:monthCombustivel, monthLabel:monthLabel, totalAllCosts:totalAllCosts };
}

function computeStats(){
  return computeStatsForVehicle(state.activeVehicleId);
}

function computeAllVehiclesSummary(dateStart, dateEnd){
  return state.vehicles.map(function(v){
    var s = computeStatsForVehicle(v.id, dateStart, dateEnd);
    return {
      id: v.id,
      label: getVehicleLabel(v),
      plate: v.plate,
      currentOdo: s.currentOdo,
      totalManutencao: s.totalManutencao,
      totalCombustivel: s.totalCombustivel,
      total: s.totalManutencao + s.totalCombustivel,
      avgConsumo: s.avgConsumo,
      lastKml: s.lastKml,
      totalOcorrencias: s.totalOcorrencias,
      totalCustoOcorrencias: s.totalCustoOcorrencias
    };
  });
}

function getLastRecord(vehicleId, excludeId){
  var all = state.maintenance.filter(function(m){return m.vehicleId===vehicleId && m.id!==excludeId;})
    .concat(state.fuel.filter(function(f){return f.vehicleId===vehicleId && f.id!==excludeId;}));
  if(all.length===0) return null;
  return all.reduce(function(latest,r){ return (!latest || r.date>latest.date) ? r : latest; }, null);
}
function violatesSequence(entry, excludeId){
  var last = getLastRecord(state.activeVehicleId, excludeId);
  if(!last) return null;
  var issues=[];
  if(entry.date < last.date) issues.push('data');
  if(Number(entry.odometer) < Number(last.odometer)) issues.push('odômetro');
  return issues.length ? issues : null;
}

function checkTankCapacity(entry, capacity){
  if(entry.gaugeBefore==null || !capacity) return null;
  var volBefore = entry.gaugeBefore * capacity;
  var volAfter = volBefore + Number(entry.liters||0);
  if(volAfter > capacity + 0.01){
    return { volBefore: volBefore, volAfter: volAfter, capacity: capacity, excess: volAfter - capacity };
  }
  return null;
}

/* ---------- mutations ---------- */
function commitMaintenance(entry, editId){
  var finalRecord;
  if(editId){
    state.maintenance = state.maintenance.map(function(m){
      if(m.id===editId){ finalRecord = Object.assign({}, entry, {id:editId, vehicleId:m.vehicleId}); return finalRecord; }
      return m;
    }).sort(function(a,b){return a.date<b.date?1:-1;});
  } else {
    finalRecord = Object.assign({}, entry, {id:uid(), vehicleId: state.activeVehicleId});
    state.maintenance = state.maintenance.concat([finalRecord]).sort(function(a,b){return a.date<b.date?1:-1;});
  }
  evaluateMissionsForRecord(finalRecord, 'manutencao');
  persist();
}
function commitFuel(entry, editId){
  var finalRecord;
  if(editId){
    state.fuel = state.fuel.map(function(f){
      if(f.id===editId){ finalRecord = Object.assign({}, entry, {id:editId, vehicleId:f.vehicleId}); return finalRecord; }
      return f;
    }).sort(function(a,b){return a.date<b.date?1:-1;});
  } else {
    finalRecord = Object.assign({}, entry, {id:uid(), vehicleId: state.activeVehicleId});
    state.fuel = state.fuel.concat([finalRecord]).sort(function(a,b){return a.date<b.date?1:-1;});
  }
  evaluateMissionsForRecord(finalRecord, 'combustivel');
  persist();
}
function addMaintenance(entry, editId){
  var issues = violatesSequence(entry, editId);
  if(issues){ state.pending = {kind:'manutencao', entry:entry, issues:issues, editId:editId}; formPrefill = entry; return true; }
  commitMaintenance(entry, editId);
  return false;
}
function addFuel(entry, editId){
  var issues = violatesSequence(entry, editId);
  if(issues){ state.pending = {kind:'abastecimento', entry:entry, issues:issues, editId:editId}; formPrefill = entry; return true; }
  commitFuel(entry, editId);
  return false;
}
function confirmPending(){
  if(!state.pending) return;
  if(state.pending.kind==='manutencao') commitMaintenance(state.pending.entry, state.pending.editId);
  else commitFuel(state.pending.entry, state.pending.editId);
  state.pending = null;
  formPrefill = null;
  modal = null;
  editingFuelId = null;
  editingMaintenanceId = null;
}
function cancelPending(){ state.pending = null; render(); }
function removeMaintenance(id){
  var removed = state.maintenance.find(function(m){return m.id===id;});
  state.maintenance = state.maintenance.filter(function(m){return m.id!==id;});
  if(removed) revokeMissionsForRecord(removed, 'manutencao');
  persist();
}
function removeFuel(id){
  var removedFuel = state.fuel.find(function(f){return f.id===id;});
  state.fuel = state.fuel.filter(function(f){return f.id!==id;});
  if(removedFuel) revokeMissionsForRecord(removedFuel, 'combustivel');
  persist();
}

function commitOccurrence(entry, editId){

function deleteVehicle(id){

  state.maintenance = state.maintenance.filter(function(m){ return m.vehicleId!==id; });
  state.fuel = state.fuel.filter(function(f){ return f.vehicleId!==id; });
  state.occurrences = state.occurrences.filter(function(o){ return o.vehicleId!==id; });
  if(state.activeVehicleId === id){
    state.activeVehicleId = state.vehicles.length ? state.vehicles[0].id : null;

/* ---------- export / import ---------- */
function exportData(){
  var payload = {
    appData:'controle-veiculo', version:DATA_VERSION, exportedAt:new Date().toISOString(),
    vehicles: state.vehicles, activeVehicleId: state.activeVehicleId, maintenance: state.maintenance, fuel: state.fuel, occurrences: state.occurrences, locations: state.locations, odometerLogs: state.odometerLogs
  };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'controle-veiculo-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function triggerImport(){
  state.importMsg = '';
  document.getElementById('import-input').click();
}
function handleImportFile(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.maintenance) || !Array.isArray(parsed.fuel)){
        state.importMsg = 'Arquivo inválido: formato não reconhecido.';
        render(); return;
      }
      state.maintenance = parsed.maintenance.map(function(m){ return Object.assign({}, m, {id:m.id||uid()}); });
      state.fuel = parsed.fuel.map(function(f){ return Object.assign({}, f, {id:f.id||uid()}); });
      state.occurrences = Array.isArray(parsed.occurrences) ? parsed.occurrences.map(function(o){ return Object.assign({}, o, {id:o.id||uid()}); }) : [];
      var importedLocations = (parsed.locations && typeof parsed.locations==='object') ? parsed.locations : {};
      state.locations = {
        manutencao: Array.isArray(importedLocations.manutencao) ? importedLocations.manutencao : [],
        combustivel: Array.isArray(importedLocations.combustivel) ? importedLocations.combustivel : [],
        ocorrencia: Array.isArray(importedLocations.ocorrencia) ? importedLocations.ocorrencia : []
      };
      state.odometerLogs = Array.isArray(parsed.odometerLogs) ? parsed.odometerLogs.map(function(o){ return Object.assign({}, o, {id:o.id||uid()}); }) : [];
      if(Array.isArray(parsed.vehicles)){
        state.vehicles = parsed.vehicles.map(function(v){ return Object.assign({}, v, {id:v.id||uid()}); });
        state.activeVehicleId = parsed.activeVehicleId || (state.vehicles[0] && state.vehicles[0].id) || null;
      } else if(parsed.vehicle){
        var legacyId = uid();
        state.vehicles = [Object.assign({}, parsed.vehicle, {id: legacyId})];
        state.activeVehicleId = legacyId;
        state.maintenance.forEach(function(m){ if(!m.vehicleId) m.vehicleId = legacyId; });
        state.fuel.forEach(function(f){ if(!f.vehicleId) f.vehicleId = legacyId; });
      }
      state.importMsg = 'Importado: '+state.vehicles.length+' veículo(s), '+state.maintenance.length+' manutenções, '+state.fuel.length+' abastecimentos, '+state.occurrences.length+' ocorrências.';
      persist();
    }catch(err){
      state.importMsg = 'Não foi possível ler o arquivo. Verifique se é um export válido deste app.';
      render();
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- modal ---------- */
function openModal(name){ modal = name; formPrefill = null; render(); }
function closeModal(){ modal = null; formPrefill = null; state.pending = null; editingVehicleId = null; vehiclePhotoDraft = null; editingFuelId = null; editingMaintenanceId = null; editingOccurrenceId = null; capacityWarning = null; render(); }

/* ---------- render ---------- */
function render(){
  var app = document.getElementById('app');
  if(!authChecked){ app.innerHTML = renderAuthSplash(); return; }
  if(!authUser){ app.innerHTML = renderLoginScreen(); attachEvents(); return; }
  if(activeTabKeys().indexOf(state.tab)===-1){ state.tab = activeTabKeys()[0]; }
  var stats = computeStats();
  var dashboardStats = state.tab==='dashboard' ? computeStatsForVehicle(state.activeVehicleId, dashFilterStart, dashFilterEnd) : null;
  var html = '';
  html += renderHeader(stats);
  html += renderTabs();
  html += renderTabTitle();
  html += '<div class="content">'+renderContent(stats, dashboardStats)+'</div>';
  html += (state.tab !== 'dashboard' && state.tab !== 'missoes' && state.tab !== 'percurso' && state.tab !== 'compartilhamento' && state.activeVehicleId) ? renderFAB() : '';
  html += (modal==='maintenance') ? renderMaintenanceForm() : '';
  html += (modal==='fuel') ? renderFuelForm() : '';
  html += (modal==='occurrence') ? renderOccurrenceForm() : '';
  html += (modal==='odometer') ? renderOdometerForm() : '';
  html += (modal==='share-compose') ? renderShareComposeModal() : '';
  html += (modal==='friends') ? renderFriendsModal() : '';
  html += (modal==='vehicle') ? renderVehicleForm() : '';
  html += (modal==='vehicle-switch') ? renderVehicleSwitch() : '';
  html += (modal==='settings') ? renderSettingsModal() : '';
  html += (state.pending) ? renderWarning() : '';
  html += (capacityWarning) ? renderCapacityWarning() : '';
  html += (achievementShareOpen) ? renderAchievementShareModal() : '';
  html += (badgesGalleryOpen) ? renderBadgesGalleryModal() : '';
  html += (pendingInvite) ? renderInviteConfirmModal() : '';
  html += (activeCelebration) ? renderCelebration() : '';
  html += '<input type="file" id="import-input" accept="application/json" style="display:none">';
  app.innerHTML = html;
  attachEvents();
  if(state.tab==='dashboard') renderCharts(dashboardStats);
  if(achievementShareOpen) drawAchievementCanvas();
}
