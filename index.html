<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TanqueCheio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111317">
<link rel="icon" href="icon-192.png">
<!-- iOS: permite abrir em tela cheia (sem barra do Safari) ao adicionar à Tela de Início -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TanqueCheio">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#111317; --bg2:#17191d; --panel:#1a1c20; --panel2:#1c1e22;
    --border:#262931; --border2:#33363d; --text:#EDEAE3; --muted:#8a8f98;
    --dim:#6a6f78; --dim2:#5a5f68; --amber:#E8A33D; --teal:#3D7068; --red:#C1503F;
    --on-accent:#14161a; --sans:'Inter', sans-serif;
    --mono:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg2); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3{ font-family:var(--sans); }
  button, input, select, textarea{ font-family:inherit; }
  #app{
    max-width:520px; margin:0 auto; min-height:100vh; position:relative;
    background:var(--bg); box-shadow:0 0 60px rgba(0,0,0,.35);
    overflow-x:hidden; padding-bottom:8px;
  }

  /* ---------- header ---------- */
  .header{ padding:18px 18px 16px; background:var(--bg2); border-bottom:1px solid var(--border); }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .header-id{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
  .vehicle-photo, .vehicle-photo-placeholder{
    width:88px; height:88px; border-radius:18px; object-fit:cover; flex-shrink:0;
    background:var(--panel2); border:1px solid var(--border2);
    display:flex; align-items:center; justify-content:center;
  }
  .header-id .txt{ min-width:0; }
  .header-id h1{ margin:0; font-size:16.5px; font-weight:700; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .header-id p{ margin:2px 0 0; font-size:11.5px; color:var(--muted); }
  .header-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .saving-tag{ font-size:11px; color:var(--dim); font-style:italic; }
  .btn-ghost{
    background:transparent; border:1px solid var(--border2); color:var(--text);
    padding:7px 11px; border-radius:999px; font-size:11.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
  }
  .btn-ghost:hover{ border-color:var(--dim2); }
  .icon-btn{
    width:32px; height:32px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--border); color:var(--muted); display:flex;
    align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{ color:var(--text); }
  .header-actions-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .header-actions-row .btn-ghost{ flex:none; padding:5px 10px; font-size:10.5px; }
  .odo-usage-row{ display:flex; gap:10px; margin-top:16px; align-items:stretch; }
  .odo-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; flex:1; min-width:0; }
  .usage-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; flex:1; min-width:0; }
  .odo-divider{ height:1px; background:var(--border); margin:12px 0; }
  .odo-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:5px; font-weight:600; }
  .odo-digits{ font-family:var(--mono); font-size:21px; font-weight:700; display:inline-flex; align-items:baseline; gap:2px; }
  .odo-digit{ background:var(--panel2); border:1px solid var(--border2); border-radius:4px; width:16px; height:24px; text-align:center; overflow:hidden; position:relative; }
  .odo-digit-strip{ display:block; }
  .odo-digit-row{ display:block; height:24px; line-height:24px; }
  .odo-suffix{ font-size:10.5px; color:var(--dim); margin-left:6px; font-weight:500; font-family:var(--sans); }
  .consumo-val{ font-size:17px; font-weight:700; margin-top:5px; }
  .consumo-sub{ font-size:11px; color:var(--dim); margin-top:3px; }

  .maint-alert-banner{ display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .maint-alert-item{ display:flex; align-items:center; gap:9px; background:var(--panel2); border:1px solid var(--border2); border-left:3px solid var(--amber); border-radius:10px; padding:9px 11px; }
  .maint-alert-item.overdue{ border-left-color:var(--red); }
  .maint-alert-txt{ display:flex; flex-direction:column; font-size:12px; line-height:1.4; }
  .maint-alert-txt strong{ font-size:12.5px; color:var(--text); }
  .maint-alert-txt span{ color:var(--muted); font-size:11px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px; min-width:0; }
  .stat-head{ display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-val{ font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:4px; padding:8px; background:var(--bg2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; gap:5px; padding:9px 4px; border-radius:8px; background:transparent; border:none; color:var(--dim); font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .tab-btn .tab-label{ overflow:hidden; text-overflow:ellipsis; }
  .tab-btn.active{ background:var(--panel); color:var(--text); }

  /* ---------- content ---------- */
  .content{ padding:16px 16px 90px; }

  .empty{ text-align:center; padding:48px 20px; color:var(--muted); }
  .empty-icon{ display:flex; justify-content:center; margin-bottom:10px; opacity:.6; }
  .empty-title{ font-size:14px; font-weight:600; color:var(--text); margin:0 0 4px; }
  .empty-sub{ font-size:12.5px; color:var(--dim); margin:0; line-height:1.5; }
  .err-msg{ color:var(--red); font-size:12px; margin-top:12px; }

  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .card-main{ flex:1; min-width:0; }
  .card-title{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .card-meta{ display:flex; gap:12px; margin-top:6px; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  .card-meta span{ display:inline-flex; align-items:center; gap:4px; }
  .card-notes{ font-size:12px; color:var(--dim); margin:6px 0 0; line-height:1.45; }
  .card-side{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
  .card-cost{ font-weight:700; font-size:14px; white-space:nowrap; }
  .card-del{ background:transparent; border:none; color:var(--dim); cursor:pointer; padding:2px; display:flex; }
  .card-del:hover{ color:var(--red); }

  /* ---------- gamificação ---------- */
  .level-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
  .level-top{ display:flex; align-items:center; gap:12px; }
  .level-badge{ width:40px; height:40px; border-radius:999px; background:var(--amber); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .level-title{ font-size:15px; font-weight:700; }
  .level-sub{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:4px; margin-top:2px; }
  .level-bar{ margin-top:12px; height:8px; border-radius:999px; background:var(--panel2); border:1px solid var(--border2); overflow:hidden; }
  .level-bar-fill{ height:100%; background:var(--amber); border-radius:999px; transition:width .3s ease; }
  .level-bar-label{ font-size:11px; color:var(--dim); margin-top:6px; text-align:right; }
  .level-tier-tag{ display:inline-block; margin-left:6px; padding:2px 9px; border-radius:999px; font-size:10px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35); vertical-align:middle; }
  .mission-list{ display:flex; flex-direction:column; gap:10px; }
  .mission-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:11px 13px; display:flex; align-items:center; gap:11px; }
  .mission-card.done{ border-color:var(--teal); }
  .mission-icon{ width:34px; height:34px; border-radius:9px; background:var(--panel2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mission-icon.done{ background:var(--teal); }
  .mission-body{ flex:1; min-width:0; }
  .mission-title{ font-size:13.5px; font-weight:600; }
  .mission-desc{ font-size:11.5px; color:var(--dim); margin-top:2px; line-height:1.4; }
  .mission-xp{ font-size:11.5px; font-weight:700; color:var(--amber); white-space:nowrap; flex-shrink:0; }
  .mission-xp.done{ display:flex; align-items:center; }

  .fab{
    position:fixed; right:calc(50% - 260px + 20px); bottom:22px; width:56px; height:56px;
    border-radius:999px; border:none; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,.4); cursor:pointer; z-index:20;
  }
  @media (max-width:559px){ .fab{ right:20px; } }

  /* ---------- overlay / sheet ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.center{ align-items:center; padding:20px; }
  .sheet{
    background:var(--bg2); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:20px 18px 28px; animation:slideUp .22s ease-out;
    border-top:1px solid var(--border2);
  }
  .sheet.teal{ border-top-color:var(--teal); }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-head h2{ margin:0; font-size:16px; font-weight:700; }
  .sheet-close{ background:var(--panel2); border:1px solid var(--border); border-radius:999px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; flex-shrink:0; }

  .field{ display:block; margin-bottom:14px; }
  .field-label{ display:block; font-size:11px; color:var(--muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input, select, textarea{
    width:100%; background:var(--panel); border:1px solid var(--border2); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:14px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--amber); }
  textarea{ resize:vertical; }

  .btn-primary{
    width:100%; padding:13px; border-radius:10px; border:none; background:var(--amber);
    color:var(--on-accent); font-weight:700; font-size:14px; display:flex; align-items:center;
    justify-content:center; gap:6px; cursor:pointer; margin-top:6px;
  }
  .btn-primary.teal{ background:var(--teal); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.06); }

  .tank-hint{ font-size:11px; color:var(--dim); margin:-6px 0 14px; line-height:1.5; }

  .odo-quick-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .odo-quick-btn{
    flex:1 1 18%; min-width:56px; background:var(--panel2); border:1px solid var(--border2); color:var(--muted);
    padding:7px 4px; border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .odo-quick-btn:hover{ color:var(--text); border-color:var(--dim2); }
  .odo-quick-btn:active{ background:var(--panel); }

  .gauge-box{ text-align:center; padding:6px 0 4px; }
  .gauge-readout{ margin-top:8px; font-size:13px; font-weight:600; color:var(--text); }

  .photo-picker{ display:flex; align-items:center; gap:14px; }
  .photo-preview, .photo-preview-placeholder{
    width:64px; height:64px; border-radius:12px; object-fit:cover; flex-shrink:0;
    background:var(--panel2); border:1px solid var(--border2); display:flex;
    align-items:center; justify-content:center;
  }
  .photo-actions{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .native-file-input{ font-size:11.5px; color:var(--muted); max-width:220px; padding:0; border:none; background:none; }
  .photo-btn.remove{
    background:transparent; border:1px solid var(--border2); color:var(--red); border-radius:8px;
    padding:6px 10px; font-size:12px; display:inline-flex; align-items:center; gap:4px;
    cursor:pointer; width:fit-content;
  }

  .theme-row{ display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .theme-row.active{ border-color:var(--amber); background:var(--panel); }
  .theme-swatch{ display:flex; flex-shrink:0; }
  .theme-swatch span{ width:16px; height:16px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.25); margin-left:-6px; }
  .theme-swatch span:first-child{ margin-left:0; }
  .theme-name{ flex:1; font-size:14px; }
  .theme-check{ color:var(--amber); display:flex; flex-shrink:0; }

  .vswitch-row{ display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer; background:var(--panel); }
  .vswitch-row.active{ border-color:var(--amber); background:var(--panel2); }
  .vswitch-photo{ width:40px; height:40px; border-radius:10px; object-fit:cover; background:var(--panel2); flex-shrink:0; }
  .vswitch-tag{ font-size:9.5px; color:var(--amber); border:1px solid var(--amber); border-radius:999px; padding:1px 6px; margin-left:6px; font-weight:600; }

  .warn-box{ background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:360px; width:90%; }
  .warn-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .warn-head h3{ margin:0; font-size:15px; }
  .warn-text{ font-size:13px; color:var(--muted); line-height:1.55; margin:0 0 18px; }
  .warn-actions{ display:flex; gap:10px; }
  .warn-btn{ flex:1; padding:11px; border-radius:8px; border:none; font-weight:600; font-size:13px; cursor:pointer; }
  .warn-btn.cancel{ background:var(--panel2); color:var(--text); border:1px solid var(--border2); }
  .warn-btn.confirm{ background:var(--red); color:#fff; }

  /* ---------- dashboard ---------- */
  .dash-section h3{ font-size:12.5px; margin:0 0 8px; color:var(--muted); font-weight:600; }
  .dash-filter{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .dash-filter-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  .dash-filter-btn{ padding:8px 14px; border-radius:8px; border:1px solid var(--border2); background:transparent; color:var(--text); font-size:12px; cursor:pointer; }
  .dash-filter-btn.primary{ background:var(--amber); border-color:var(--amber); color:var(--on-accent); font-weight:700; }
  .dash-card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; height:250px; position:relative; }
  .dash-card.short{ height:170px; }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:11.5px; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  .dash-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .dash-table th, .dash-table td{ padding:9px 11px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  .dash-table th{ color:var(--dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; background:var(--panel2); }
  .dash-table tbody tr{ cursor:pointer; }
  .dash-table tbody tr:hover{ background:var(--panel2); }
  .dash-table tbody tr.active-row{ background:var(--panel2); }
  .dash-table tbody tr:last-child td{ border-bottom:none; }
  .table-plate{ font-size:10.5px; color:var(--dim); font-family:var(--mono); }

  .backup-box{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .backup-desc{ font-size:12px; color:var(--muted); line-height:1.55; margin:0 0 12px; }
  .backup-actions{ display:flex; gap:10px; }
  .backup-btn{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--border2); background:var(--panel2); color:var(--text); font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
  .backup-btn:hover{ border-color:var(--dim2); }
  .import-msg{ font-size:11.5px; margin-top:10px; display:flex; align-items:center; gap:6px; }

  @media (max-width:380px){
    .stat-grid{ gap:6px; }
    .odo-digits{ font-size:18px; }
    .tab-btn{ font-size:10.5px; padding:8px 2px; gap:3px; }
  }

  /* ---------- celebração (missão / nível) ---------- */
  .celebrate-overlay{
    position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(255,180,60,.25), rgba(0,0,0,.82) 70%);
    overflow:hidden; animation:celebrateFadeIn .25s ease-out;
  }
  @keyframes celebrateFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .confetti-piece{
    position:absolute; top:-12px; width:9px; height:14px; opacity:.95; border-radius:2px;
    transform:rotate(var(--rot)); animation-name:confettiFall; animation-timing-function:ease-in;
    animation-iteration-count:1; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--drift), 115vh) rotate(calc(var(--rot) + 360deg)); opacity:.85; }
  }
  .celebrate-card{
    position:relative; z-index:1; text-align:center; padding:34px 30px 26px; border-radius:26px;
    background:linear-gradient(160deg, var(--amber), #ff6b6b 65%, #8338ec);
    box-shadow:0 0 0 1px rgba(255,255,255,.15), 0 20px 60px rgba(0,0,0,.55), 0 0 90px rgba(255,180,60,.45);
    max-width:340px; width:88%; animation:celebrateCardPop .55s cubic-bezier(.17,.89,.32,1.28);
    cursor:default;
  }
  .celebrate-card.is-levelup{ background:linear-gradient(160deg, #8338ec, #118ab2 60%, #06d6a0); }
  @keyframes celebrateCardPop{
    0%{ transform:scale(.4) translateY(30px); opacity:0; }
    60%{ transform:scale(1.08) translateY(-4px); opacity:1; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  .celebrate-burst{
    position:absolute; inset:-40%; z-index:-1; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 60%);
    animation:celebratePulse 1.6s ease-out infinite;
  }
  @keyframes celebratePulse{
    0%{ transform:scale(.6); opacity:.9; }
    100%{ transform:scale(1.5); opacity:0; }
  }
  .celebrate-headline{
    font-size:25px; font-weight:900; letter-spacing:.03em; color:#fff; text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,.35); margin-bottom:14px; animation:celebrateShake .5s ease-in-out .1s;
  }
  @keyframes celebrateShake{
    0%, 100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-3deg); }
    40%{ transform:rotate(3deg); }
    60%{ transform:rotate(-2deg); }
    80%{ transform:rotate(2deg); }
  }
  .celebrate-mission{ display:flex; align-items:center; justify-content:center; gap:8px; color:#fff; font-size:15px; font-weight:700; margin-bottom:6px; }
  .celebrate-xp{ font-size:32px; font-weight:900; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.4); animation:celebrateXpPop .5s cubic-bezier(.17,.89,.32,1.28) .15s both; }

<script>
/* ---------- constants ---------- */
const FUEL_TYPES = ['Gasolina','Aditivada','Etanol','Diesel','GNV'];
const SERVICE_TYPES_ROTINA = ['Calibragem de pneu','Verificar nível de óleo','Verificar nível do fluido de arrefecimento','Limpeza'];
const SERVICE_TYPES_PERIODICO = ['Troca de óleo e filtro','Troca de correia','Troca de cabo de vela','Ar condicionado','Troca de filtro do ar condicionado','Troca de embreagem','Troca de bateria','Troca do disco de freio','Troca da pastilha de freio','Alinhamento e Balanceamento','Troca do pneu'];
const SERVICE_TYPES = SERVICE_TYPES_ROTINA.concat(SERVICE_TYPES_PERIODICO).concat(['Outro']);
// Intervalos padrão (km) de senso comum, usados para pré-preencher e disparar os alertas de manutenção
const DEFAULT_MAINTENANCE_INTERVALS = {
  'Troca de óleo e filtro': 5000,
  'Troca de correia': 50000,
  'Troca de cabo de vela': 50000,
  'Ar condicionado': 15000,
  'Troca de filtro do ar condicionado': 15000,
  'Troca de embreagem': 60000,
  'Troca de bateria': 40000,
  'Troca do disco de freio': 60000,
  'Troca da pastilha de freio': 30000,
  'Alinhamento e Balanceamento': 10000,
  'Troca do pneu': 50000
};
function applyDefaultMaintenanceIntervals(){
  if(!state.maintenanceIntervals) state.maintenanceIntervals = {};
  SERVICE_TYPES_PERIODICO.forEach(function(service){
    if(state.maintenanceIntervals[service] == null && DEFAULT_MAINTENANCE_INTERVALS[service] != null){
      state.maintenanceIntervals[service] = DEFAULT_MAINTENANCE_INTERVALS[service];
    }
  });
}
const OCCURRENCE_TYPES = ['Batida','Pneu furado','Arranhões','Outro'];

/* ---------- gamificação: missões e níveis ---------- */
// Cada missão "casa" automaticamente com um lançamento (manutenção/abastecimento/ocorrência)
// já existente no app. recurrence define o período de repetição da missão:
//  - {type:'daily'}      -> reseta todo dia
//  - {type:'days', value:N}  -> reseta a cada N dias (contados a partir do lançamento que a cumpriu)
//  - {type:'km', value:N}   -> reseta a cada N km rodados
const MISSIONS = [
  { id:'diario-bordo', title:'Diário de bordo', icon:'calendar', xp:10,
    recurrence:{type:'days', value:7}, trigger:'navigation',
    matches:function(rec, type){ return false; } },
  { id:'calibragem-pneu', title:'Calibragem dos pneus', icon:'gauge', xp:20,
    recurrence:{type:'days', value:10},
    matches:function(rec, type){ return type==='manutencao' && rec.description==='Calibragem de pneu'; } },
  { id:'nivel-oleo', title:'Nível do óleo', icon:'droplet', xp:20,
    recurrence:{type:'km', value:1000},
    matches:function(rec, type){ return type==='manutencao' && rec.description==='Verificar nível de óleo'; } },
  { id:'fluido-arrefecimento', title:'Fluido de arrefecimento', icon:'droplet', xp:15,
    recurrence:{type:'days', value:30},
    matches:function(rec, type){ return type==='manutencao' && rec.description==='Verificar nível do fluido de arrefecimento'; } },
  { id:'limpeza', title:'Limpeza', icon:'car', xp:10,
    recurrence:{type:'days', value:30},
    matches:function(rec, type){ return type==='manutencao' && rec.description==='Limpeza'; } },
  { id:'abastecimento-aditivada', title:'Abastecimento com aditivada', icon:'fuel', xp:15,
    recurrence:{type:'days', value:30},
    matches:function(rec, type){ return type==='combustivel' && rec.fuelType==='Aditivada'; } }
];
function dayNumber(dateStr){ return Math.floor(new Date(dateStr+'T00:00:00').getTime() / 86400000); }
function periodKeyForMission(mission, record){
  if(mission.recurrence.type==='daily') return record.date;
  if(mission.recurrence.type==='days') return String(Math.floor(dayNumber(record.date) / mission.recurrence.value));
  if(mission.recurrence.type==='km'){
    var odo = Number(record.odometer);
    if(isNaN(odo)) return null;
    return String(Math.floor(odo / mission.recurrence.value));
  }
  return null;
}
// XP cumulativo necessário para alcançar um nível (nível 1 começa em 0 XP; cada nível fica um pouco mais difícil)
function xpForLevel(level){
  var total = 0;
  for(var i=1;i<level;i++){ total += 100 + (i-1)*40; }
  return total;
}
function getLevelInfo(xp){
  xp = xp || 0;
  var level = 1;
  while(xpForLevel(level+1) <= xp && level < 200){ level++; }
  var floorXp = xpForLevel(level);
  var span = xpForLevel(level+1) - floorXp;
  return { level:level, xpTotal:xp, xpIntoLevel:xp-floorXp, xpForNextLevel:span };
}
// Paleta de cores por faixa de nível — o visual do card de nível evolui conforme o usuário avança.
function getLevelTier(level){
  if(level>=30) return { name:'Lendário', gradient:'linear-gradient(135deg,#a855f7,#ec4899 55%,#f59e0b)' };
  if(level>=20) return { name:'Diamante', gradient:'linear-gradient(135deg,#7dd3fc,#6366f1)' };
  if(level>=15) return { name:'Platina', gradient:'linear-gradient(135deg,#5eead4,#0d9488)' };
  if(level>=10) return { name:'Ouro', gradient:'linear-gradient(135deg,#fde68a,#f59e0b)' };
  if(level>=5) return { name:'Prata', gradient:'linear-gradient(135deg,#e5e7eb,#94a3b8)' };
  return { name:'Bronze', gradient:'linear-gradient(135deg,#e3a469,#a5672c)' };
}
// Registra automaticamente o cumprimento de missões quando um novo lançamento é salvo.
// Cada (missão + veículo + período) só concede XP uma única vez.
function evaluateMissionsForRecord(record, recordType){
  if(!record || !record.vehicleId) return;
  if(!state.gamification) state.gamification = { xp:0, completions:{} };
  MISSIONS.forEach(function(mission){
    if(!mission.matches(record, recordType)) return;
    var pk = periodKeyForMission(mission, record);
    if(pk==null) return;
    var key = mission.id+'|'+record.vehicleId+'|'+pk;
    if(!state.gamification.completions[key]){
      var levelBefore = getLevelInfo(state.gamification.xp).level;
      state.gamification.completions[key] = { date: record.date, xp: mission.xp };
      state.gamification.xp = (state.gamification.xp||0) + mission.xp;
      var levelAfter = getLevelInfo(state.gamification.xp).level;
      queueCelebration({ type:'mission', title: mission.title, xp: mission.xp, icon: mission.icon });
      if(levelAfter > levelBefore){
        queueCelebration({ type:'levelup', level: levelAfter });
      }
    }
  });
}
// Reverte o cumprimento de uma missão quando o registro que a justificava é excluído,
// descontando o XP concedido — mas só se nenhum outro registro remanescente ainda a justificar.
function revokeMissionsForRecord(record, recordType){
  if(!record || !record.vehicleId) return;
  if(!state.gamification || !state.gamification.completions) return;
  var collection = recordType==='manutencao' ? state.maintenance
    : (recordType==='combustivel' ? state.fuel : state.occurrences);
  MISSIONS.forEach(function(mission){
    if(!mission.matches(record, recordType)) return;
    var pk = periodKeyForMission(mission, record);
    if(pk==null) return;
    var key = mission.id+'|'+record.vehicleId+'|'+pk;
    var completion = state.gamification.completions[key];
    if(!completion) return; // essa conquista nem existia — nada a reverter
    var stillJustified = collection.some(function(r){
      return r.vehicleId===record.vehicleId && mission.matches(r, recordType) && periodKeyForMission(mission, r)===pk;
    });
    if(!stillJustified){
      var xpToRemove = completion.xp || mission.xp;
      delete state.gamification.completions[key];
      state.gamification.xp = Math.max(0, (state.gamification.xp||0) - xpToRemove);
    }
  });
}
function periodKeyNow(mission){
  if(mission.recurrence.type==='daily') return new Date().toISOString().slice(0,10);
  if(mission.recurrence.type==='days') return String(Math.floor(dayNumber(new Date().toISOString().slice(0,10)) / mission.recurrence.value));
  return null;
}
function evaluateNavigationMissions(vehicleId){
  if(!vehicleId) return;
  if(!state.gamification) state.gamification = { xp:0, completions:{} };
  MISSIONS.forEach(function(mission){
    if(mission.trigger !== 'navigation') return;
    var pk = periodKeyNow(mission);
    if(pk==null) return;
    var key = mission.id+'|'+vehicleId+'|'+pk;
    if(!state.gamification.completions[key]){
      var levelBefore = getLevelInfo(state.gamification.xp).level;
      state.gamification.completions[key] = { date: new Date().toISOString().slice(0,10), xp: mission.xp };
      state.gamification.xp = (state.gamification.xp||0) + mission.xp;
      var levelAfter = getLevelInfo(state.gamification.xp).level;
      queueCelebration({ type:'mission', title: mission.title, xp: mission.xp, icon: mission.icon });
      if(levelAfter > levelBefore){
        queueCelebration({ type:'levelup', level: levelAfter });
      }
    }
  });
}
function computeMissionStatus(mission, vehicleId){
  var records = state.maintenance.filter(function(m){return m.vehicleId===vehicleId;}).map(function(m){return {rec:m, type:'manutencao'};})
    .concat(state.fuel.filter(function(f){return f.vehicleId===vehicleId;}).map(function(f){return {rec:f, type:'combustivel'};}))
    .concat(state.occurrences.filter(function(o){return o.vehicleId===vehicleId;}).map(function(o){return {rec:o, type:'ocorrencia'};}));
  var matching = records.filter(function(r){ return mission.matches(r.rec, r.type); });
  var nowKey;
  if(mission.recurrence.type==='daily'){
    nowKey = new Date().toISOString().slice(0,10);
  } else if(mission.recurrence.type==='days'){
    nowKey = String(Math.floor(dayNumber(new Date().toISOString().slice(0,10)) / mission.recurrence.value));
  } else if(mission.recurrence.type==='km'){
    var stats = computeStatsForVehicle(vehicleId);
    nowKey = String(Math.floor(stats.currentOdo / mission.recurrence.value));
  }
  var done = !!(state.gamification && state.gamification.completions[mission.id+'|'+vehicleId+'|'+nowKey]);
  var lastMatch = matching.length ? matching.reduce(function(a,b){ return (!a || b.rec.date>a.rec.date) ? b : a; }, null) : null;
  var subtitle;
  if(mission.trigger==='navigation'){
    subtitle = done ? 'Concluída neste período' : 'Basta abrir o app · repete a cada '+mission.recurrence.value+' dias';
  } else if(mission.recurrence.type==='daily'){
    subtitle = done ? 'Concluída hoje' : 'Ainda pendente hoje';
  } else if(mission.recurrence.type==='days'){
    if(done){ subtitle = 'Em dia neste período'; }
    else if(lastMatch){
      var daysAgo = Math.round((Date.now() - new Date(lastMatch.rec.date+'T00:00:00').getTime())/86400000);
      subtitle = 'Última vez há '+daysAgo+' dia(s) · repete a cada '+mission.recurrence.value+' dias';
    } else { subtitle = 'Nunca registrada · repete a cada '+mission.recurrence.value+' dias'; }
  } else if(mission.recurrence.type==='km'){
    if(done){ subtitle = 'Em dia neste período'; }
    else if(lastMatch && !isNaN(Number(lastMatch.rec.odometer))){
      var stats2 = computeStatsForVehicle(vehicleId);
      var kmSince = Math.max(0, stats2.currentOdo - Number(lastMatch.rec.odometer));
      subtitle = formatKm(kmSince)+' desde a última · repete a cada '+mission.recurrence.value.toLocaleString('pt-BR')+' km';
    } else { subtitle = 'Nunca registrada · repete a cada '+mission.recurrence.value.toLocaleString('pt-BR')+' km'; }
  }
  return { done: done, subtitle: subtitle, xp: mission.xp };
}

let celebrationQueue = []; // fila de eventos de comemoração (missão concluída / subiu de nível) aguardando exibição
let activeCelebration = null; // evento de comemoração exibido no momento, ou null
const CONFETTI_COLORS = ['#ffd166','#ef476f','#06d6a0','#118ab2','#8338ec','#ff8fab','#ffbe0b'];

/* ---------- celebração (missão concluída / nível subiu) ---------- */
function queueCelebration(evt){
  celebrationQueue.push(evt);
  if(!activeCelebration) advanceCelebration();
}
function advanceCelebration(){
  // não chama render() aqui: este ponto é sempre alcançado durante o fluxo de salvar um registro
  // (evaluateMissionsForRecord/evaluateNavigationMissions), que já é seguido de perto por um persist()
  // ou render() do chamador. Renderizar aqui também causava 2 renderizações extras e desnecessárias
  // em sequência rápida, fazendo a foto do veículo "piscar" (some e reaparece) durante a comemoração.
  activeCelebration = celebrationQueue.shift() || null;
  if(activeCelebration && !activeCelebration.confetti){
    activeCelebration.confetti = [];
    for(var i=0;i<48;i++){
      activeCelebration.confetti.push({
        left: Math.random()*100,
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        delay: (Math.random()*0.5).toFixed(2),
        duration: (2.1 + Math.random()*1.3).toFixed(2),
        rotate: Math.floor(Math.random()*360),
        drift: Math.floor(Math.random()*80-40)
      });
    }
    playCelebrationHorn();
  }
}
function dismissCelebration(){ advanceCelebration(); render(); }

/* buzinaço de comemoração — som sintetizado via Web Audio API, sem depender de arquivo externo */
function playCelebrationHorn(){
  try{
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    var ctx = new AudioCtx();
    function honk(startTime, duration){
      var osc1 = ctx.createOscillator();
      var osc2 = ctx.createOscillator();
      var gain = ctx.createGain();
      osc1.type = 'sawtooth';
      osc2.type = 'sawtooth';
      osc1.frequency.value = 330; // tom grave clássico de buzina
      osc2.frequency.value = 415; // segundo tom, levemente dissonante — imita buzinas de dois tons
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.32, startTime+0.03);
      gain.gain.setValueAtTime(0.32, Math.max(startTime+0.03, startTime+duration-0.05));
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime+duration);
      osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
      osc1.start(startTime); osc2.start(startTime);
      osc1.stop(startTime+duration); osc2.stop(startTime+duration);
    }
    var now = ctx.currentTime;
    honk(now, 0.24);
    honk(now+0.32, 0.24);
    honk(now+0.64, 0.55);
    setTimeout(function(){ ctx.close(); }, 1700);
  }catch(e){ /* áudio indisponível ou bloqueado pelo navegador — segue sem som */ }
}

function resizeImageFile(file, maxDim, cb){
  try{
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var img = new Image();
        img.onload = function(){
          try{
            var w = img.width, h = img.height;
            var scale = Math.min(1, maxDim/Math.max(w,h));
            var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            var url = canvas.toDataURL('image/jpeg', 0.82);
            cb(url, null);
          }catch(err2){ cb(null, 'Falha ao processar a imagem (canvas): '+err2.message); }
        };
        img.onerror = function(){ cb(null, 'Não foi possível carregar a imagem selecionada.'); };
        img.src = e.target.result;
      }catch(err1){ cb(null, 'Falha ao ler a imagem: '+err1.message); }
    };
    reader.onerror = function(){ cb(null, 'Não foi possível acessar o arquivo selecionado.'); };
    reader.readAsDataURL(file);
  }catch(err0){ cb(null, 'Falha inesperada ao processar a foto: '+err0.message); }
}

/* ---------- persistence ---------- */
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      state.maintenance = parsed.maintenance || [];
      state.fuel = parsed.fuel || [];
      state.occurrences = parsed.occurrences || [];
      state.maintenanceIntervals = parsed.maintenanceIntervals || {};
      state.gamification = (parsed.gamification && typeof parsed.gamification==='object')
        ? { xp: Number(parsed.gamification.xp)||0, completions: parsed.gamification.completions || {} }
        : { xp: 0, completions: {} };
      var loadedLocations = (parsed.locations && typeof parsed.locations==='object') ? parsed.locations : {};
      state.locations = {
        manutencao: Array.isArray(loadedLocations.manutencao) ? loadedLocations.manutencao : [],
        combustivel: Array.isArray(loadedLocations.combustivel) ? loadedLocations.combustivel : [],
        ocorrencia: Array.isArray(loadedLocations.ocorrencia) ? loadedLocations.ocorrencia : []
      };
      if(Array.isArray(parsed.vehicles)){
        state.vehicles = parsed.vehicles;
        state.activeVehicleId = parsed.activeVehicleId || (parsed.vehicles[0] && parsed.vehicles[0].id) || null;
      } else if(parsed.vehicle && (parsed.vehicle.plate || parsed.vehicle.brand || parsed.vehicle.model)){
        // migrate legacy single-vehicle format
        var legacyId = uid();
        state.vehicles = [Object.assign({}, parsed.vehicle, {id: legacyId})];
        state.activeVehicleId = legacyId;
        state.maintenance.forEach(function(m){ if(!m.vehicleId) m.vehicleId = legacyId; });
        state.fuel.forEach(function(f){ if(!f.vehicleId) f.vehicleId = legacyId; });
      }
    }
  }catch(e){ /* start empty */ }
  applyDefaultMaintenanceIntervals();
}
function persist(){
  state.saving = true;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ maintenance: state.maintenance, fuel: state.fuel, occurrences: state.occurrences, vehicles: state.vehicles, activeVehicleId: state.activeVehicleId, maintenanceIntervals: state.maintenanceIntervals, gamification: state.gamification, locations: state.locations }));
    state.errorMsg = '';
  }catch(e){
    state.errorMsg = 'Não foi possível salvar. O armazenamento do navegador pode estar cheio ou bloqueado.';
  }
  state.saving = false;
  render();
}

function getVehicleLabel(v){
  if(!v) return 'Veículo';

  return title;

function getVolumeAfter(entry, fallbackCapacity){
  var cap = entry.tankCapacityAtEntry || fallbackCapacity || DEFAULT_TANK_CAPACITY;
  if(entry.gaugeBefore!=null){
    var before = entry.gaugeBefore * cap;
    return Math.min(before + Number(entry.liters||0), cap);
  }
  if(entry.fullTank) return cap; // legacy entries saved before the gauge feature
  return null; // legacy entry without gauge data — unknown tank level after fill
}
function getVolumeBefore(entry, fallbackCapacity){
  var cap = entry.tankCapacityAtEntry || fallbackCapacity || DEFAULT_TANK_CAPACITY;
  if(entry.gaugeBefore!=null) return entry.gaugeBefore * cap;
  return null;
}

function computeStatsForVehicle(vehicleId, dateStart, dateEnd){
  var vehicle = state.vehicles.find(function(v){ return v.id===vehicleId; });
  var vehicleCapacity = vehicle ? vehicle.tankCapacity : DEFAULT_TANK_CAPACITY;
  var maint = state.maintenance.filter(function(m){ return m.vehicleId === vehicleId; });
  var fuelList = state.fuel.filter(function(f){ return f.vehicleId === vehicleId; });
  var occList = state.occurrences.filter(function(o){ return o.vehicleId === vehicleId; });
  if(dateStart){ maint = maint.filter(function(m){return m.date>=dateStart;}); fuelList = fuelList.filter(function(f){return f.date>=dateStart;}); occList = occList.filter(function(o){return o.date>=dateStart;}); }
  if(dateEnd){ maint = maint.filter(function(m){return m.date<=dateEnd;}); fuelList = fuelList.filter(function(f){return f.date<=dateEnd;}); occList = occList.filter(function(o){return o.date<=dateEnd;}); }

  var totalManutencao = maint.reduce(function(s,m){return s+Number(m.cost||0);},0);
  var totalCombustivel = fuelList.reduce(function(s,f){return s+Number(f.cost||0);},0);
  var allOdo = maint.map(function(m){return Number(m.odometer);})
    .concat(fuelList.map(function(f){return Number(f.odometer);}))
    .filter(function(n){return !isNaN(n);});
  var initOdo = (vehicle && vehicle.initialOdometer!=null && !isNaN(Number(vehicle.initialOdometer))) ? Number(vehicle.initialOdometer) : null;
  var odoCandidates = allOdo.concat(initOdo!=null ? [initOdo] : []);
  var currentOdo = odoCandidates.length ? Math.max.apply(null, odoCandidates) : 0;
  var totalKmTraveled;
  if(initOdo!=null){
    totalKmTraveled = Math.max(0, currentOdo - initOdo);
  } else {
    totalKmTraveled = allOdo.length>=2 ? (Math.max.apply(null, allOdo) - Math.min.apply(null, allOdo)) : 0;
  }

  var recordsWithOdo = maint.concat(fuelList).filter(function(r){ return r.date && !isNaN(Number(r.odometer)); });
  var firstRecord = recordsWithOdo.length ? recordsWithOdo.reduce(function(earliest,r){ return (!earliest || r.date<earliest.date) ? r : earliest; }, null) : null;
  var avgKmPerDay = null;
  if(firstRecord){
    var firstDate = new Date(firstRecord.date+'T00:00:00');
    var today = new Date(); today.setHours(0,0,0,0);
    var daysSinceFirst = Math.max(1, Math.round((today - firstDate) / 86400000));
    avgKmPerDay = Math.max(0, (currentOdo - Number(firstRecord.odometer)) / daysSinceFirst);
  }

  var fuelByOdo = fuelList.filter(function(f){return !isNaN(Number(f.odometer));}).slice().sort(function(a,b){return a.odometer-b.odometer;});
  var totalKm=0, totalLitros=0;
  var consumptionTrend = [];
  for(var i=1;i<fuelByOdo.length;i++){
    var prev = fuelByOdo[i-1], cur = fuelByOdo[i];
    var dist = Number(cur.odometer) - Number(prev.odometer);
    var volAfterPrev = getVolumeAfter(prev, vehicleCapacity);
    var volBeforeCur = getVolumeBefore(cur, vehicleCapacity);
    var consumed = (volAfterPrev!=null && volBeforeCur!=null) ? (volAfterPrev - volBeforeCur) : Number(cur.liters||0);
    if(dist>0 && consumed>0){
      totalKm += dist; totalLitros += consumed;
      consumptionTrend.push({ label: formatDate(cur.date), kml: Number((dist/consumed).toFixed(2)) });
    }
  }
  var avgConsumo = totalLitros>0 ? totalKm/totalLitros : null;

  var lastKml = consumptionTrend.length ? consumptionTrend[consumptionTrend.length-1].kml : null;

  var allDatesForDays = maint.map(function(m){return m.date;})
    .concat(fuelList.map(function(f){return f.date;}))
    .concat(occList.map(function(o){return o.date;}))
    .filter(Boolean);
  var lastRecordDate = allDatesForDays.length ? allDatesForDays.reduce(function(a,b){return b>a?b:a;}) : null;
  var totalDaysUsed = null;
  if(vehicle && vehicle.acquisitionDate && lastRecordDate){
    var dAcq = new Date(vehicle.acquisitionDate+'T00:00:00');
    var dLast = new Date(lastRecordDate+'T00:00:00');
    totalDaysUsed = Math.max(0, Math.round((dLast - dAcq) / 86400000));
  }

  var monthMap = {};
  maint.forEach(function(m){ var k=(m.date||'').slice(0,7); if(!k) return; monthMap[k]=monthMap[k]||{month:k,manutencao:0,combustivel:0}; monthMap[k].manutencao+=Number(m.cost||0); });
  fuelList.forEach(function(f){ var k=(f.date||'').slice(0,7); if(!k) return; monthMap[k]=monthMap[k]||{month:k,manutencao:0,combustivel:0}; monthMap[k].combustivel+=Number(f.cost||0); });
  var monthly = Object.keys(monthMap).map(function(k){return monthMap[k];}).sort(function(a,b){return a.month>b.month?1:-1;});

  var serviceMap = {};
  maint.forEach(function(m){ var k=m.description||'Outro'; serviceMap[k]=(serviceMap[k]||0)+Number(m.cost||0); });
  var serviceBreakdown = Object.keys(serviceMap).map(function(name){return {name:name, value:serviceMap[name]};});

  var totalOcorrencias = occList.length;
  var totalCustoOcorrencias = occList.reduce(function(s,o){return s+Number(o.cost||0);},0);
  var occMap = {};
  occList.forEach(function(o){ var k=o.description||'Outro'; occMap[k]=(occMap[k]||0)+1; });
  var occurrenceBreakdown = Object.keys(occMap).map(function(name){return {name:name, value:occMap[name]};});

  var totalAllCosts = Number(totalManutencao||0) + Number(totalCombustivel||0) + Number(totalCustoOcorrencias||0);
  var costPerDay = (totalDaysUsed && totalDaysUsed>0) ? (totalAllCosts/totalDaysUsed) : null;

  return { totalManutencao:totalManutencao, totalCombustivel:totalCombustivel, currentOdo:currentOdo, totalKmTraveled:totalKmTraveled, avgKmPerDay:avgKmPerDay, avgConsumo:avgConsumo, lastKml:lastKml, monthly:monthly, serviceBreakdown:serviceBreakdown, consumptionTrend:consumptionTrend, totalOcorrencias:totalOcorrencias, totalCustoOcorrencias:totalCustoOcorrencias, occurrenceBreakdown:occurrenceBreakdown, totalDaysUsed:totalDaysUsed, costPerDay:costPerDay };
}

function computeStats(){

function computeAllVehiclesSummary(dateStart, dateEnd){

      avgConsumo: s.avgConsumo,
      lastKml: s.lastKml,
      totalOcorrencias: s.totalOcorrencias,
      totalCustoOcorrencias: s.totalCustoOcorrencias
    };
  });
}

function getLastRecord(vehicleId, excludeId){
  var all = state.maintenance.filter(function(m){return m.vehicleId===vehicleId && m.id!==excludeId;})
    .concat(state.fuel.filter(function(f){return f.vehicleId===vehicleId && f.id!==excludeId;}));
  if(all.length===0) return null;
  return all.reduce(function(latest,r){ return (!latest || r.date>latest.date) ? r : latest; }, null);
}
function violatesSequence(entry, excludeId){
  var last = getLastRecord(state.activeVehicleId, excludeId);
  if(!last) return null;
  var issues=[];
  if(entry.date < last.date) issues.push('data');
  if(Number(entry.odometer) < Number(last.odometer)) issues.push('odômetro');
  return issues.length ? issues : null;
}

function checkTankCapacity(entry, capacity){
  if(entry.gaugeBefore==null || !capacity) return null;
  var volBefore = entry.gaugeBefore * capacity;
  var volAfter = volBefore + Number(entry.liters||0);
  if(volAfter > capacity + 0.01){
    return { volBefore: volBefore, volAfter: volAfter, capacity: capacity, excess: volAfter - capacity };
  }
  return null;
}

/* ---------- mutations ---------- */
function commitMaintenance(entry, editId){
  var finalRecord;
  if(editId){
    state.maintenance = state.maintenance.map(function(m){
      if(m.id===editId){ finalRecord = Object.assign({}, entry, {id:editId, vehicleId:m.vehicleId}); return finalRecord; }
      return m;
    }).sort(function(a,b){return a.date<b.date?1:-1;});
  } else {
    finalRecord = Object.assign({}, entry, {id:uid(), vehicleId: state.activeVehicleId});
    state.maintenance = state.maintenance.concat([finalRecord]).sort(function(a,b){return a.date<b.date?1:-1;});
  }
  evaluateMissionsForRecord(finalRecord, 'manutencao');
  persist();
}
function commitFuel(entry, editId){
  var finalRecord;
  if(editId){
    state.fuel = state.fuel.map(function(f){
      if(f.id===editId){ finalRecord = Object.assign({}, entry, {id:editId, vehicleId:f.vehicleId}); return finalRecord; }

  } else {

    state.fuel = state.fuel.concat([finalRecord]).sort(function(a,b){return a.date<b.date?1:-1;});
  }

}
function addMaintenance(entry, editId){

  if(issues){ state.pending = {kind:'manutencao', entry:entry, issues:issues, editId:editId}; formPrefill = entry; return true; }

  if(!state.pending) return;
  if(state.pending.kind==='manutencao') commitMaintenance(state.pending.entry, state.pending.editId);

/* ---------- export / import ---------- */
function exportData(){
  var payload = {
    appData:'controle-veiculo', version:DATA_VERSION, exportedAt:new Date().toISOString(),
    vehicles: state.vehicles, activeVehicleId: state.activeVehicleId, maintenance: state.maintenance, fuel: state.fuel, occurrences: state.occurrences, locations: state.locations
  };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'controle-veiculo-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function triggerImport(){
  state.importMsg = '';
  document.getElementById('import-input').click();
}
function handleImportFile(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.maintenance) || !Array.isArray(parsed.fuel)){
        state.importMsg = 'Arquivo inválido: formato não reconhecido.';
        render(); return;
      }
      state.maintenance = parsed.maintenance.map(function(m){ return Object.assign({}, m, {id:m.id||uid()}); });
      state.fuel = parsed.fuel.map(function(f){ return Object.assign({}, f, {id:f.id||uid()}); });
      state.occurrences = Array.isArray(parsed.occurrences) ? parsed.occurrences.map(function(o){ return Object.assign({}, o, {id:o.id||uid()}); }) : [];
      var importedLocations = (parsed.locations && typeof parsed.locations==='object') ? parsed.locations : {};
      state.locations = {
        manutencao: Array.isArray(importedLocations.manutencao) ? importedLocations.manutencao : [],
        combustivel: Array.isArray(importedLocations.combustivel) ? importedLocations.combustivel : [],
        ocorrencia: Array.isArray(importedLocations.ocorrencia) ? importedLocations.ocorrencia : []
      };
      if(Array.isArray(parsed.vehicles)){
        state.vehicles = parsed.vehicles.map(function(v){ return Object.assign({}, v, {id:v.id||uid()}); });
        state.activeVehicleId = parsed.activeVehicleId || (state.vehicles[0] && state.vehicles[0].id) || null;
      } else if(parsed.vehicle){
        var legacyId = uid();
        state.vehicles = [Object.assign({}, parsed.vehicle, {id: legacyId})];
        state.activeVehicleId = legacyId;
        state.maintenance.forEach(function(m){ if(!m.vehicleId) m.vehicleId = legacyId; });
        state.fuel.forEach(function(f){ if(!f.vehicleId) f.vehicleId = legacyId; });
      }
      state.importMsg = 'Importado: '+state.vehicles.length+' veículo(s), '+state.maintenance.length+' manutenções, '+state.fuel.length+' abastecimentos, '+state.occurrences.length+' ocorrências.';
      persist();
    }catch(err){
      state.importMsg = 'Não foi possível ler o arquivo. Verifique se é um export válido deste app.';
      render();
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

  html += (modal==='maintenance') ? renderMaintenanceForm() : '';
  html += (modal==='fuel') ? renderFuelForm() : '';
  html += (modal==='occurrence') ? renderOccurrenceForm() : '';
  html += (modal==='vehicle') ? renderVehicleForm() : '';
  html += (modal==='vehicle-switch') ? renderVehicleSwitch() : '';

function fuelLevelLabel(fraction){
  if(fraction <= 0.06) return 'E (vazio)';
  if(fraction >= 0.94) return 'F (cheio)';
  var eighth = Math.round(fraction*8);
  var map = {1:'1/8',2:'1/4',3:'3/8',4:'1/2',5:'5/8',6:'3/4',7:'7/8'};
  return map[eighth] || (Math.round(fraction*100)+'%');
}

function renderGaugeSVG(fraction, divisions){
  divisions = divisions || DEFAULT_GAUGE_DIVISIONS;
  var cx=110, cy=118, r=82;
  var angleDeg = 180 - fraction*180;
  var rad = angleDeg * Math.PI/180;
  var tipX = cx + r*Math.cos(rad);
  var tipY = cy - r*Math.sin(rad);
  function tick(deg, len1, len2){
    var rr = deg*Math.PI/180;
    var x1 = cx + len1*Math.cos(rr), y1 = cy - len1*Math.sin(rr);
    var x2 = cx + len2*Math.cos(rr), y2 = cy - len2*Math.sin(rr);
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--border2)" stroke-width="2"/>';
  }
  var tickDegs = [];
  for(var i=0;i<=divisions;i++){ tickDegs.push(180 - i*(180/divisions)); }
  var ticks = tickDegs.map(function(d){ return tick(d, 68, 78); }).join('');
  return '' +
  '<svg id="fuel-gauge-svg" viewBox="0 0 220 135" style="width:100%; max-width:260px; display:block; margin:0 auto; touch-action:none; cursor:pointer;">' +
    '<path d="M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="var(--border)" stroke-width="16" stroke-linecap="round"/>' +
    ticks +
    '<text x="'+(cx-r-4)+'" y="'+(cy+16)+'" fill="var(--red)" font-size="13" font-weight="700" text-anchor="middle">E</text>' +
    '<text x="'+cx+'" y="'+(cy-r-8)+'" fill="var(--muted)" font-size="11" text-anchor="middle">½</text>' +
    '<text x="'+(cx+r+4)+'" y="'+(cy+16)+'" fill="var(--teal)" font-size="13" font-weight="700" text-anchor="middle">F</text>' +
    '<line id="gauge-needle" x1="'+cx+'" y1="'+cy+'" x2="'+tipX+'" y2="'+tipY+'" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="var(--amber)"/>' +
  '</svg>';
}

function updateMaintenanceInterval(service, value){
  var km = parseKmValue(value);
  if(!state.maintenanceIntervals) state.maintenanceIntervals = {};
  if(km > 0) state.maintenanceIntervals[service] = km;
  else delete state.maintenanceIntervals[service];
  persist();
}

function computeMaintenanceAlerts(vehicleId, currentOdo){
  var intervals = state.maintenanceIntervals || {};
  var alerts = [];
  Object.keys(intervals).forEach(function(service){
    var interval = Number(intervals[service]);
    if(!interval || interval <= 0) return;
    var records = state.maintenance.filter(function(m){ return m.vehicleId===vehicleId && m.description===service && !isNaN(Number(m.odometer)); });
    if(!records.length) return;
    var last = records.reduce(function(latest,r){
      if(!latest) return r;
      if(r.date > latest.date) return r;
      if(r.date === latest.date && Number(r.odometer) > Number(latest.odometer)) return r;
      return latest;
    }, null);
    var lastOdo = Number(last.odometer);
    var nextDueKm = lastOdo + interval;
    var remaining = nextDueKm - Number(currentOdo);
    var threshold = Math.max(200, Math.round(interval * 0.1));
    if(remaining <= threshold){
      alerts.push({
        service: service,
        overdue: remaining <= 0,
        remaining: remaining,
        nextDueKm: nextDueKm
      });
    }
  });
  return alerts.sort(function(a,b){ return a.remaining - b.remaining; });
}

/* ---------- event delegation ---------- */
function attachEvents(){
  var app = document.getElementById('app');

  app.querySelectorAll('[data-action]').forEach(function(el){
    var action = el.getAttribute('data-action');
    el.addEventListener('click', function(e){
      if(action==='set-tab'){ state.tab = el.getAttribute('data-tab'); render(); }
      else if(action==='open-form'){
        modal = state.tab==='manutencao' ? 'maintenance' : (state.tab==='ocorrencias' ? 'occurrence' : 'fuel');
        editingFuelId = null; editingMaintenanceId = null; editingOccurrenceId = null;
        var lastOdo = state.activeVehicleId ? computeStatsForVehicle(state.activeVehicleId).currentOdo : null;
        formPrefill = (lastOdo!=null && lastOdo>0) ? { odometer: lastOdo } : null;
        if(modal==='fuel') fuelGaugeFraction = 0.5;
        render();
      }
      else if(action==='open-vehicle-switch'){ openModal('vehicle-switch'); }
      else if(action==='open-settings'){ openModal('settings'); }
      else if(action==='select-theme'){ applyTheme(el.getAttribute('data-theme')); }
      else if(action==='add-vehicle'){ editingVehicleId = null; vehiclePhotoDraft = null; openModal('vehicle'); }
      else if(action==='edit-vehicle'){
        e.stopPropagation();
        editingVehicleId = el.getAttribute('data-id');
        var editVeh = state.vehicles.find(function(x){return x.id===editingVehicleId;});
        vehiclePhotoDraft = editVeh ? (editVeh.photo || null) : null;
        openModal('vehicle');
      }
      else if(action==='delete-vehicle'){
        e.stopPropagation();
        var vid = el.getAttribute('data-id');
        var vv = state.vehicles.find(function(x){return x.id===vid;});
        var label = vv ? getVehicleLabel(vv) : 'este veículo';
        if(window.confirm('Excluir '+label+'? Isso também apaga todas as manutenções e abastecimentos registrados para ele.')){
          deleteVehicle(vid);
        }
      }
      else if(action==='select-vehicle'){ selectVehicle(el.getAttribute('data-id')); if(modal==='vehicle-switch') closeModal(); }
      else if(action==='remove-photo'){
        vehiclePhotoDraft = null;
        var wrap = document.getElementById('v-photo-wrap');
        if(wrap){
          wrap.innerHTML = '<div class="photo-preview-placeholder">'+icon('car',22,'var(--dim2)')+'</div>' +
            '<div class="photo-actions"><input type="file" id="v-photo-input" accept="image/*" class="native-file-input"></div>';
          document.getElementById('v-photo-input').addEventListener('change', handlePhotoInputChange);
        }
      }
      else if(action==='close-modal'){ closeModal(); }
      else if(action==='close-modal-bg'){ if(e.target===el) closeModal(); }
      else if(action==='odo-quick'){
        var odoInput = document.getElementById('f-odo');
        if(odoInput){
          var amount = Number(el.getAttribute('data-amount')) || 0;
          var curOdo = parseKmValue(odoInput.value) || 0;
          odoInput.value = formatKmInt(curOdo + amount);
        }
      }
      else if(action==='odo-clear'){
        var odoInputClear = document.getElementById('f-odo');
        if(odoInputClear) odoInputClear.value = '';
      }
      else if(action==='del-maintenance'){ removeMaintenance(el.getAttribute('data-id')); }
      else if(action==='edit-maintenance'){
        var mid = el.getAttribute('data-id');
        var mentry = state.maintenance.find(function(x){return x.id===mid;});
        if(mentry){
          editingMaintenanceId = mid;
          formPrefill = mentry;
          modal = 'maintenance';
          render();
        }
      }
      else if(action==='find-address-maps'){
        var addrVal = (document.getElementById('f-address').value || '').trim();
        awaitingAddressPaste = true;
        if(addrVal){
          window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addrVal), '_blank');
        } else if(navigator.geolocation){
          navigator.geolocation.getCurrentPosition(function(pos){
            var lat = pos.coords.latitude, lng = pos.coords.longitude;
            window.open('https://www.google.com/maps/search/?api=1&query='+lat+','+lng, '_blank');
          }, function(){
            window.open('https://www.google.com/maps', '_blank');
          });
        } else {
          window.open('https://www.google.com/maps', '_blank');
        }
      }
      else if(action==='edit-fuel'){
        var fid = el.getAttribute('data-id');
        var fentry = state.fuel.find(function(x){return x.id===fid;});
        if(fentry){
          editingFuelId = fid;
          formPrefill = fentry;
          fuelGaugeFraction = fentry.gaugeBefore!=null ? fentry.gaugeBefore : 0.5;
          modal = 'fuel';
          render();
        }
      }
      else if(action==='del-fuel'){ removeFuel(el.getAttribute('data-id')); }
      else if(action==='del-occurrence'){ removeOccurrence(el.getAttribute('data-id')); }

        if(oentry){
          editingOccurrenceId = oid;
          formPrefill = oentry;
          modal = 'occurrence';
          render();
        }
      }
      else if(action==='cancel-pending'){ cancelPending(); }
      else if(action==='confirm-pending'){ confirmPending(); render(); }
      else if(action==='ack-capacity-warning'){ capacityWarning = null; render(); }
      else if(action==='dismiss-celebration'){ dismissCelebration(); }
      else if(action==='apply-dash-filter'){
        dashFilterStart = document.getElementById('dash-filter-start').value;
        dashFilterEnd = document.getElementById('dash-filter-end').value;
        render();
      }
      else if(action==='clear-dash-filter'){ dashFilterStart=''; dashFilterEnd=''; render(); }
      else if(action==='export'){ exportData(); }
      else if(action==='import'){ triggerImport(); }
      else if(action==='save-maintenance'){
        var date = document.getElementById('f-date').value;
        var service = document.getElementById('f-service').value;
        var custom = document.getElementById('f-custom').value;
        var cost = parseMasked(document.getElementById('f-cost').value);
        var odo = document.getElementById('f-odo').value;
        var address = document.getElementById('f-address').value.trim();
        var addressName = document.getElementById('f-location-name') ? document.getElementById('f-location-name').value : '';
        var notes = document.getElementById('f-notes').value;
        var warrantyRaw = document.getElementById('f-warranty').value;
        var warrantyMonths = warrantyRaw !== '' ? parseInt(warrantyRaw, 10) : null;
        if(!date || !odo) return;
        var description = service==='Outro' ? (custom || 'Outro') : service;
        var isPending = addMaintenance({ date:date, description:description, cost:cost, odometer:parseKmValue(odo), address:address, notes:notes, warrantyMonths:warrantyMonths }, editingMaintenanceId);
        saveLocationIfNew('manutencao', address, addressName);
        triggerOdoRoll();
        if(isPending) render(); else closeModal();
      }
      else if(action==='save-occurrence'){
        var odate = document.getElementById('f-date').value;
        var otype = document.getElementById('f-occtype').value;
        var ocustom = document.getElementById('f-occtype-custom').value;
        var ocost = parseMasked(document.getElementById('f-cost').value);
        var oodo = document.getElementById('f-odo').value;
        var oaddress = document.getElementById('f-address').value.trim();
        var oaddressName = document.getElementById('f-location-name') ? document.getElementById('f-location-name').value : '';
        var onotes = document.getElementById('f-notes').value;
        if(!odate) return;
        var odescription = otype==='Outro' ? (ocustom || 'Outro') : otype;
        addOccurrence({ date:odate, description:odescription, cost:ocost, odometer: oodo ? parseKmValue(oodo) : null, address:oaddress, notes:onotes }, editingOccurrenceId);
        saveLocationIfNew('ocorrencia', oaddress, oaddressName);
        if(oodo) triggerOdoRoll();
        closeModal();
      }
      else if(action==='save-fuel'){
        var date2 = document.getElementById('f-date').value;
        var fuelType = document.getElementById('f-fueltype').value;
        var liters = parseMasked(document.getElementById('f-liters').value);
        var cost2 = parseMasked(document.getElementById('f-cost').value);
        var odo2 = document.getElementById('f-odo').value;
        var address2 = document.getElementById('f-address').value.trim();
        var addressName2 = document.getElementById('f-location-name') ? document.getElementById('f-location-name').value : '';
        if(!date2 || !odo2) return;
        var activeVehicleForFuel = state.vehicles.find(function(v){return v.id===state.activeVehicleId;});
        var capacityNow = activeVehicleForFuel ? activeVehicleForFuel.tankCapacity : DEFAULT_TANK_CAPACITY;
        var fuelEntry = { date:date2, fuelType:fuelType, liters:liters, cost:cost2, odometer:parseKmValue(odo2), address:address2, gaugeBefore: fuelGaugeFraction, tankCapacityAtEntry: capacityNow };
        var capIssue = checkTankCapacity(fuelEntry, capacityNow);
        if(capIssue){
          capacityWarning = capIssue;
          formPrefill = fuelEntry;
          render();
          return;
        }
        var isPending2 = addFuel(fuelEntry, editingFuelId);
        saveLocationIfNew('combustivel', address2, addressName2);
        triggerOdoRoll();
        if(isPending2) render(); else closeModal();
      }
      else if(action==='save-vehicle'){
        var plate = document.getElementById('v-plate').value.trim().toUpperCase();
        var brandSel = document.getElementById('v-brand').value;
        var brand, model;
        if(brandSel === OUTRA_MARCA){
          brand = (document.getElementById('v-custom-brand').value || '').trim();
          model = (document.getElementById('v-custom-model').value || '').trim();
        } else {
          brand = brandSel;
          var modelSel = document.getElementById('v-model').value;
          if(modelSel === OUTRO_MODELO){
            model = (document.getElementById('v-custom-model').value || '').trim();
          } else {
            model = modelSel;
          }
        }
        var color = document.getElementById('v-color').value.trim();
        var tankCapacity = Number(document.getElementById('v-tank').value) || getDefaultTankCapacity(brand, model);
        var gaugeDivisionsVal = parseInt(document.getElementById('v-gaugedivisions').value, 10);
        var gaugeDivisions = (gaugeDivisionsVal && gaugeDivisionsVal>=2) ? gaugeDivisionsVal : DEFAULT_GAUGE_DIVISIONS;
        var acquisitionDate = document.getElementById('v-acqdate').value;
        var purchaseValue = parseMasked(document.getElementById('v-acqvalue').value);
        var initOdoVal = document.getElementById('v-initodo').value;
        var initialOdometer = parseKmValue(initOdoVal);
        var vData = { plate:plate, brand:brand, model:model, color:color, tankCapacity:tankCapacity, gaugeDivisions:gaugeDivisions, photo:vehiclePhotoDraft, acquisitionDate:acquisitionDate, purchaseValue:purchaseValue, initialOdometer:initialOdometer };
        if(editingVehicleId){ updateVehicle(editingVehicleId, vData); }
        else { addVehicle(vData); }
        closeModal();
      }
    });
  });

  var maintCostEl = document.getElementById('f-cost');
  var litersEl = document.getElementById('f-liters');
  var priceEl = document.getElementById('f-priceperliter');

  if(litersEl && priceEl && maintCostEl){
    // fuel form: o usuário preenche 2 dos 3 campos (litros, custo/litro, custo total) — o terceiro é sempre calculado
    // a partir dos 2 campos que o usuário DE FATO editou por último, nessa ordem, não importa qual foi preenchido primeiro
    var fuelTouchOrder = [];
    var recalcFuelValues = function(source){
      var idx = fuelTouchOrder.indexOf(source);
      if(idx!==-1) fuelTouchOrder.splice(idx,1);
      fuelTouchOrder.unshift(source);
      fuelTouchOrder = fuelTouchOrder.slice(0,2);
      if(fuelTouchOrder.length<2) return; // ainda falta o segundo campo pra dar pra calcular o terceiro

      var liters = parseMasked(litersEl.value);
      var price = parseMasked(priceEl.value);
      var total = parseMasked(maintCostEl.value);

      if(fuelTouchOrder.indexOf('liters')===-1){
        // usuário preencheu custo/litro + custo total -> calcula litros
        if(price>0) litersEl.value = toMaskedStr(total/price);
      } else if(fuelTouchOrder.indexOf('price')===-1){
        // usuário preencheu litros + custo total -> calcula custo/litro
        if(liters>0) priceEl.value = toMaskedStr(total/liters);
      } else if(fuelTouchOrder.indexOf('total')===-1){
        // usuário preencheu litros + custo/litro -> calcula custo total
        maintCostEl.value = toMaskedStr(liters*price);
      }
    };
    wireMoneyMask('f-liters', function(){ recalcFuelValues('liters'); });
    wireMoneyMask('f-priceperliter', function(){ recalcFuelValues('price'); });
    wireMoneyMask('f-cost', function(){ recalcFuelValues('total'); });
  } else if(maintCostEl){
    // maintenance form: cost only needs the decimal mask, no cross-calc
    wireMoneyMask('f-cost');
  }

  var serviceSel = document.getElementById('f-service');
  if(serviceSel){
    var toggleCustom = function(){ document.getElementById('f-custom-wrap').style.display = serviceSel.value==='Outro' ? 'block' : 'none'; };
    serviceSel.addEventListener('change', toggleCustom);
    toggleCustom();
  }

  var occTypeSel = document.getElementById('f-occtype');
  if(occTypeSel){
    var toggleOccCustom = function(){ document.getElementById('f-occtype-custom-wrap').style.display = occTypeSel.value==='Outro' ? 'block' : 'none'; };
    occTypeSel.addEventListener('change', toggleOccCustom);
    toggleOccCustom();
  }

  var brandSel = document.getElementById('v-brand');
  if(brandSel){
    brandSel.addEventListener('change', function(){
      var isOutra = brandSel.value === OUTRA_MARCA;
      document.getElementById('v-custom-brand-wrap').style.display = isOutra ? 'block' : 'none';
      document.getElementById('v-model-wrap').style.display = isOutra ? 'none' : 'block';
      var tankInput = document.getElementById('v-tank');
      if(!isOutra){
        var models = BRANDS[brandSel.value] || [];
        var opts = models.map(function(m){ return '<option value="'+m+'">'+m+'</option>'; }).join('') + '<option value="'+OUTRO_MODELO+'">'+OUTRO_MODELO+'</option>';
        var modelSelEl = document.getElementById('v-model');
        modelSelEl.innerHTML = opts;
        document.getElementById('v-custom-model-wrap').style.display = 'none';
        if(tankInput) tankInput.value = getDefaultTankCapacity(brandSel.value, modelSelEl.value);
      } else {
        document.getElementById('v-custom-model-wrap').style.display = 'block';
        if(tankInput) tankInput.value = DEFAULT_TANK_CAPACITY;
      }
    });
  }
  var modelSel = document.getElementById('v-model');
  if(modelSel){
    modelSel.addEventListener('change', function(){
      document.getElementById('v-custom-model-wrap').style.display = modelSel.value===OUTRO_MODELO ? 'block' : 'none';
      var tankInput = document.getElementById('v-tank');
      if(tankInput && modelSel.value!==OUTRO_MODELO && brandSel){
        tankInput.value = getDefaultTankCapacity(brandSel.value, modelSel.value);
      }
    });
  }
  if(document.getElementById('v-acqvalue')) wireMoneyMask('v-acqvalue');

  document.querySelectorAll('.km-input').forEach(function(kmEl){ wireKmMask(kmEl); });

  var addressEl = document.getElementById('f-address');
  if(addressEl){
    var locCategory = addressEl.getAttribute('data-category');
    var locSelect = document.getElementById('f-location-select');
    var nameWrap = document.getElementById('f-location-name-wrap');
    var refreshNameVisibility = function(){
      var match = findLocationByAddress(locCategory, addressEl.value);
      if(nameWrap) nameWrap.style.display = (addressEl.value.trim() && !match) ? 'block' : 'none';
      if(locSelect) locSelect.value = match ? match.id : '';
    };
    addressEl.addEventListener('input', refreshNameVisibility);
    if(locSelect){
      locSelect.addEventListener('change', function(){
        if(locSelect.value){
          var loc = findLocationById(locCategory, locSelect.value);
          if(loc) addressEl.value = loc.address;
        } else {
          addressEl.value = '';
          addressEl.focus();
        }
        refreshNameVisibility();
      });
    }
  }
  document.querySelectorAll('.maint-interval-input').forEach(function(mEl){
    mEl.addEventListener('change', function(){
      updateMaintenanceInterval(mEl.getAttribute('data-service'), mEl.value);
    });
  });

  var importInput = document.getElementById('import-input');
  if(importInput) importInput.addEventListener('change', handleImportFile);

  var photoInput = document.getElementById('v-photo-input');
  if(photoInput) photoInput.addEventListener('change', handlePhotoInputChange);

  var gaugeSvg = document.getElementById('fuel-gauge-svg');
  if(gaugeSvg){
    var activeVehicleForGauge = state.vehicles.find(function(v){return v.id===state.activeVehicleId;});
    var gaugeCapacity = activeVehicleForGauge ? (activeVehicleForGauge.tankCapacity || DEFAULT_TANK_CAPACITY) : DEFAULT_TANK_CAPACITY;
    var cx=110, cy=118, r=82;

    function updateGaugeVisual(fraction){
      fuelGaugeFraction = fraction;
      var angleDeg = 180 - fraction*180;
      var rad = angleDeg * Math.PI/180;
      var tipX = cx + r*Math.cos(rad);
      var tipY = cy - r*Math.sin(rad);
      var needle = document.getElementById('gauge-needle');
      if(needle){ needle.setAttribute('x2', tipX); needle.setAttribute('y2', tipY); }
      var readout = document.getElementById('gauge-readout');
      if(readout){ readout.textContent = fuelLevelLabel(fraction)+' · ~'+Math.round(fraction*gaugeCapacity)+' L de '+gaugeCapacity+' L'; }
    }

    function fractionFromEvent(evt){
      var pt = gaugeSvg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      var ctm = gaugeSvg.getScreenCTM();
      if(!ctm) return null;
      var svgP = pt.matrixTransform(ctm.inverse());
      var dx = svgP.x - cx, dy = cy - svgP.y;
      var angle = Math.atan2(dy, dx) * 180/Math.PI; // -180..180, valid range 0..180 (upper half)
      if(dy < 0){
        angle = dx >= 0 ? 0 : 180; // pointer dragged below the pivot line — clamp to nearest end
      }
      angle = Math.max(0, Math.min(180, angle));
      return 1 - (angle/180);
    }

    var dragging = false;
    gaugeSvg.addEventListener('pointerdown', function(evt){
      dragging = true;
      try{ gaugeSvg.setPointerCapture(evt.pointerId); }catch(e){}
      var fr = fractionFromEvent(evt);
      if(fr!=null) updateGaugeVisual(fr);
    });
    gaugeSvg.addEventListener('pointermove', function(evt){
      if(!dragging) return;
      var fr = fractionFromEvent(evt);
      if(fr!=null) updateGaugeVisual(fr);
    });
    gaugeSvg.addEventListener('pointerup', function(){ dragging = false; });
    gaugeSvg.addEventListener('pointercancel', function(){ dragging = false; });
  }

  if(pendingOdoRollAnimation){
    pendingOdoRollAnimation = false;
    var odoStrips = document.querySelectorAll('.odo-digit-strip');
    odoStrips.forEach(function(strip, idx){
      var endPx = parseFloat(strip.getAttribute('data-target-offset'));
      // salta instantaneamente para o início da tira (mostrando "0"), sem transição
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0px)';
      void strip.offsetHeight; // força o navegador a registrar o estado inicial antes de animar
      setTimeout(function(){
        strip.style.transition = 'transform 1.05s cubic-bezier(.16,.84,.29,1)';
        strip.style.transform = 'translateY('+endPx+'px)';
      }, idx*80); // pequena defasagem por dígito, criando um efeito de rolagem em cascata
    });
  }
}

/* ---------- init ---------- */
var THEME_STORAGE_KEY = 'controle-veiculo-theme';
var THEMES = {
  preto: {
    name: 'Preto (atual)',
    vars: { '--bg':'#111317','--bg2':'#17191d','--panel':'#1a1c20','--panel2':'#1c1e22','--border':'#262931','--border2':'#33363d','--text':'#EDEAE3','--muted':'#8a8f98','--dim':'#6a6f78','--dim2':'#5a5f68','--amber':'#E8A33D','--teal':'#3D7068','--red':'#C1503F','--on-accent':'#14161a','--sans':"'Inter', sans-serif" }
  },
  branco: {
    name: 'Branco',
    vars: { '--bg':'#f7f6f3','--bg2':'#ffffff','--panel':'#ffffff','--panel2':'#f1f0ec','--border':'#e3e1da','--border2':'#d3d0c7','--text':'#202226','--muted':'#6b7078','--dim':'#8a8f97','--dim2':'#9ea3aa','--amber':'#c9791a','--teal':'#2f6f5e','--red':'#b0392c','--on-accent':'#ffffff','--sans':"'Poppins', sans-serif" }
  },
  rosa: {
    name: 'Rosa',
    vars: { '--bg':'#fff2f6','--bg2':'#ffffff','--panel':'#ffe9f0','--panel2':'#ffdce8','--border':'#f6c3d6','--border2':'#eda9c4','--text':'#4a1f2e','--muted':'#96677c','--dim':'#b98a9c','--dim2':'#c9a2b2','--amber':'#d6336c','--teal':'#9c4f7c','--red':'#c0392b','--on-accent':'#ffffff','--sans':"'Quicksand', sans-serif" }
  }
};
var currentTheme = 'preto';
function applyTheme(key, skipRender){
  var theme = THEMES[key] ? key : 'preto';
  currentTheme = theme;
  var vars = THEMES[theme].vars;
  var root = document.documentElement;
  Object.keys(vars).forEach(function(k){ root.style.setProperty(k, vars[k]); });
  try{ localStorage.setItem(THEME_STORAGE_KEY, theme); }catch(e){}
  if(!skipRender) render();
}
function loadTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_STORAGE_KEY); }catch(e){}
  applyTheme(saved || 'preto', true);
}

loadTheme();
load();
evaluateNavigationMissions(state.activeVehicleId);
render();

/* ---------- auto-paste address on return from Google Maps ---------- */
function tryPasteAddressFromClipboard(){
  if(!awaitingAddressPaste) return;
  awaitingAddressPaste = false;
  var addrInput = document.getElementById('f-address');
  if(!addrInput) return;
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(text){
      var trimmed = (text||'').trim();
      var el = document.getElementById('f-address');
      if(trimmed && el){
        el.value = trimmed;
        el.dispatchEvent(new Event('input'));
      }
    }).catch(function(){ /* clipboard indisponível ou sem permissão — usuário cola manualmente */ });
  }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') tryPasteAddressFromClipboard();
});
window.addEventListener('focus', tryPasteAddressFromClipboard);

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* PWA offline indisponível — app continua funcionando normalmente online */ });
  });
}
